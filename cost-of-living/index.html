<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cost of Living Estimator | Florida Gulf Coast Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
@font-face{font-family:Cinzel;src:url("../assets/fonts/Cinzel-VF.ttf") format("truetype");font-weight:100 900;font-style:normal;font-display:swap}
:root{--navy:#001F3F;--gold:#D4AF37;--paper:#F5F7FA;--slate:#5A7A9A;--line:#808A98;--white:#fff}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0;min-height:100%;background:var(--paper);color:var(--navy);font-family:Inter,Arial,Helvetica,sans-serif;font-size:16px;line-height:1.5}
button,input{font:inherit;color:inherit}
.skip{position:absolute;left:12px;top:-48px;background:var(--gold);color:var(--navy);padding:8px 12px;z-index:9;font-weight:700;border-radius:8px}
.skip:focus{top:8px}
.siteHeader,.siteFooter{background:var(--navy);color:var(--white);text-align:center}
.siteHeader{padding:28px 16px 22px}
.logo{width:min(480px,88vw);height:auto;display:block;margin:0 auto;background:none;border:0}
.siteTitle{margin:8px 0 0;font-family:Cinzel,Georgia,"Times New Roman",serif;font-weight:600;letter-spacing:.08em;text-transform:uppercase;line-height:1.15}
.titleLine{display:block;font-size:clamp(28px,4vw,44px)}
.titleGold{color:var(--gold)}
.siteTitle::after{content:"";display:block;width:72px;height:2px;margin:12px auto 0;background:var(--gold)}
main{padding:20px 16px 36px}
.sheet{background:var(--white);border:1px solid var(--line);border-radius:8px;padding:clamp(18px,3vw,28px)}
.sheet.narrow{width:min(720px,100%);margin:0 auto}
h2,h3{font-family:Cinzel,Georgia,"Times New Roman",serif;font-weight:600;letter-spacing:.06em;text-transform:uppercase;line-height:1.2;margin:0 0 12px}
h2{font-size:clamp(22px,3vw,32px)}
h2::after{content:"";display:block;width:64px;height:2px;margin-top:10px;background:var(--gold)}
h3{font-size:16px;margin-top:18px}
h3::after{content:"";display:block;width:40px;height:2px;margin-top:8px;background:var(--gold)}
p{margin:0 0 12px}
.lead{margin-top:0}
.areaList{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px;padding:0;list-style:none}
.areaList li{border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.workspace{width:min(1120px,100%);margin:0 auto;display:grid;gap:16px;align-items:start}
.workspace>*{min-width:0}
.fields{display:grid;gap:14px}
label,legend{font-weight:700;display:block;margin-bottom:6px}
.optional{font-weight:400}
fieldset{margin:0;padding:12px;border:1px solid var(--line);border-radius:8px}
.choices{display:grid;gap:8px}
.choices.two{grid-template-columns:1fr 1fr}
.option,.primary,.secondary{border-radius:8px;cursor:pointer;min-height:44px;padding:10px 14px}
.option{width:100%;text-align:left;background:var(--white);border:1px solid var(--line);font-weight:600}
.option[aria-pressed="true"]{background:var(--navy);color:var(--white);border-color:var(--navy)}
.primary{display:inline-flex;align-items:center;justify-content:center;background:var(--gold);color:var(--navy);border:1px solid var(--gold);font-weight:700;text-decoration:none;text-align:center}
.secondary{background:var(--white);color:var(--navy);border:1px solid var(--navy);font-weight:700}
input{width:100%;background:var(--white);border:1px solid var(--line);border-radius:8px;padding:12px 14px;min-height:44px}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:18px}
.actions>*{flex:1 1 200px}
.status{min-height:1.4em;margin:8px 0 0;font-weight:600}
.results{background:var(--navy);color:var(--white);border:1px solid var(--gold);border-radius:8px;padding:18px 16px 16px}
.kicker{font-family:Cinzel,Georgia,"Times New Roman",serif;font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:14px;margin:0 0 6px}
.big{font-family:Cinzel,Georgia,"Times New Roman",serif;font-weight:600;font-size:clamp(64px,10vw,88px);line-height:.95;color:var(--gold);margin:0 0 8px;letter-spacing:0;text-transform:none}
.bigNote{color:var(--white);margin:0 0 14px}
.breakdown{background:var(--white);color:var(--navy);border:1px solid var(--gold);border-radius:8px;padding:14px}
.breakdown h2,.breakdown h3{color:var(--navy)}
.indexTable,.parts{width:100%;border-collapse:collapse;font-size:16px}
.tableWrap{overflow-x:auto;max-width:100%}
.indexTable,.parts{width:100%;table-layout:fixed}
.indexTable th,.parts th,.parts td{font-weight:700;padding:8px 8px 8px 0;vertical-align:top;overflow-wrap:anywhere}
.indexTable td,.parts td{text-align:right;font-variant-numeric:tabular-nums;padding:8px 0 8px 8px}
.parts thead th{text-align:right}
.parts thead th:first-child,.parts tbody th{text-align:left;font-weight:700}
.indexTable tr+tr th,.indexTable tr+tr td,.parts tr+tr th,.parts tr+tr td{border-top:1px solid var(--line)}
.sub{display:block;font-weight:400;font-size:14px;margin-top:2px}
.chart{margin:8px 0 4px}
.barRow{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:8px;margin:0 0 10px}
.barName{font-weight:600;font-size:14px}
.barValue{font-weight:700;font-variant-numeric:tabular-nums}
.barTrack{grid-column:1 / -1;position:relative;height:14px;margin-top:4px;background:var(--paper);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.usMark{position:absolute;top:0;bottom:0;width:1px;background:var(--slate);z-index:1}
.bar{display:block;height:100%;border-radius:8px 0 0 8px;position:relative;z-index:0}
.barGold{border-right:1px solid var(--navy);border-top:1px solid var(--navy);border-bottom:1px solid var(--navy)}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin:4px 0 8px;padding:0;list-style:none;font-size:14px}
.legend li{display:flex;align-items:center;gap:6px}
.swatch{width:14px;height:14px;border-radius:8px;display:inline-block;border:1px solid var(--navy)}
.chartNote{font-size:14px;margin:0 0 6px}
.source{font-size:14px;margin:0 0 12px}
.source a{color:var(--navy)}
.results .primary{width:100%;margin-top:4px}
.siteFooter{padding:22px 16px 28px}
.siteFooter p{margin:0 0 6px}
.siteFooter a{color:var(--white)}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
:focus:not(:focus-visible){outline:none}
:focus-visible{outline:2px solid var(--navy);outline-offset:2px;box-shadow:0 0 0 2px var(--gold)}
.results :focus-visible,.siteHeader :focus-visible,.siteFooter :focus-visible{outline:2px solid var(--gold);outline-offset:2px;box-shadow:0 0 0 2px var(--navy)}
@media(min-width:900px){
 .workspace{grid-template-columns:minmax(0,1.15fr) minmax(300px,420px)}
 .results{position:sticky;top:16px}
 .choices.three{grid-template-columns:1fr 1fr 1fr}
}
@media(max-width:699px){
 .choices.two,.choices.three{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){
 *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;scroll-behavior:auto !important}
}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="siteHeader">
<img class="logo" src="logo_h_white.png" alt="Florida Gulf Coast Guide">
<h1 class="siteTitle"><span class="titleLine">Cost of living</span><span class="titleLine titleGold">Estimator</span></h1>
</header>
<main id="main"><div id="panel"></div></main>
<footer class="siteFooter">
<p>Guy Golan, eXp Realty</p>
<p><a href="tel:+13019196726">301-919-6726</a></p>
<p><a href="../">Moving cost estimator</a></p>
</footer>
<script src="lookup.js"></script>
<script>
const BOOKING_URL='https://calendar.app.google/5xtMmGSY9kCY5NRk7';
const NAVY='#001F3F';
const GOLD='#D4AF37';
const SLATE='#5A7A9A';
const SCALE=140;
const A={zip:'',city:'',household:'',incomeKind:'',amount:'',tenure:''};
let bundle=null;
let renderGen=0;
const panel=document.getElementById('panel');
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function focusHeading(){
  const h=panel.querySelector('h2');
  if(!h)return;
  h.tabIndex=-1;
  h.focus({focusVisible:false});
}
function bookingLink(){
  return '<a class="primary" href="'+esc(BOOKING_URL)+'" target="_blank" rel="noopener noreferrer">Schedule a call with Guy</a>';
}
function isSourced(figure){
  return !!figure && typeof figure.value==='number' && !Number.isNaN(figure.value) && figure.evidence==='MEASURED' && /^[\d.]+$/.test(String(figure.display||''));
}
function go(step){
  const name=step==='compare'?'compare':'intro';
  history.pushState({step:name},'',name==='intro'?'#':'#'+name);
  render(name);
}
function loadZipShard(zip){
  const raw=String(zip||'');
  const code=/^\d{5}(-\d{4})?$/.test(raw)?raw.slice(0,5):'';
  if(!code){
    bundle.crosswalk.zips=[];
    bundle.crosswalk.loadedPrefix='';
    return Promise.resolve();
  }
  const prefix=code.slice(0,3);
  if(bundle.crosswalk.loadedPrefix===prefix && Array.isArray(bundle.crosswalk.zips)) return Promise.resolve();
  return fetch('zips/'+prefix+'.json').then(function(res){
    if(!res.ok) throw new Error('missing shard');
    return res.json();
  }).then(function(shard){
    bundle.crosswalk.zips=shard.zips||[];
    bundle.crosswalk.loadedPrefix=prefix;
  });
}
function render(step){
  if(step==='compare') workspace();
  else intro();
  focusHeading();
}
function intro(){
  const areas=(bundle.areas||[]).map(a=>'<li>'+esc(a.name)+'</li>').join('');
  panel.innerHTML='<article class="sheet narrow"><h2>Compare home with the Gulf Coast</h2><p class="lead">See how the 2024 price index where you live now compares with Manatee County, Hillsborough County, Pinellas County, Sarasota County, Venice, and North Port. The U.S. average is 100.</p><ul class="areaList">'+areas+'</ul><div class="actions"><button type="button" class="primary" id="startBtn">Compare your area</button>'+bookingLink()+'</div></article>';
  document.getElementById('startBtn').onclick=()=>go('compare');
}
function choiceButtons(name, choices, current){
  return '<div class="choices'+(choices.length>2?' three':' two')+'" role="group" aria-label="'+esc(name)+'">'+choices.map(c=>'<button type="button" class="option" data-group="'+esc(name)+'" data-id="'+esc(c.id)+'" aria-pressed="'+(current===c.id?'true':'false')+'">'+esc(c.label)+'</button>').join('')+'</div>';
}
function workspace(){
  const incomeOpen=A.incomeKind&&A.incomeKind!=='skip';
  panel.innerHTML='<div class="workspace"><form class="sheet" id="inputs"><h2>Your details</h2><p class="lead">Enter a ZIP code to see the 2024 price index for where you live now. The U.S. average is 100.</p><div class="fields"><div><label for="zip">ZIP code</label><input id="zip" inputmode="numeric" autocomplete="postal-code" maxlength="10" value="'+esc(A.zip)+'"><p class="status" id="zipStatus" role="status"></p></div><div><label for="city">City and state <span class="optional">Optional</span></label><input id="city" autocomplete="address-level2" maxlength="80" value="'+esc(A.city)+'"></div><fieldset><legend>Household size <span class="optional">Optional</span></legend>'+choiceButtons('household',[{id:'1',label:'1 person'},{id:'2',label:'2 people'},{id:'3',label:'3 people'},{id:'4',label:'4 people'},{id:'5+',label:'5 or more'}],A.household)+'</fieldset><fieldset><legend>Income <span class="optional">Optional. Stays in this browser and is not saved.</span></legend>'+choiceButtons('income',[{id:'annual-income',label:'Annual income'},{id:'monthly-budget',label:'Monthly budget'},{id:'skip',label:'Skip'}],A.incomeKind)+'<div id="amountWrap"'+(incomeOpen?'':' hidden')+'><label for="amount">Amount</label><input id="amount" inputmode="decimal" autocomplete="off" value="'+esc(A.amount)+'"></div></fieldset><fieldset><legend>Renting or buying <span class="optional">Optional</span></legend>'+choiceButtons('tenure',[{id:'rent',label:'Renting'},{id:'own',label:'Buying'},{id:'skip',label:'Not sure'}],A.tenure)+'</fieldset></div><div class="actions"><button type="button" class="secondary" id="backBtn">Back</button><button type="button" class="secondary" id="clearBtn">Clear</button></div></form><aside class="results" id="results" aria-live="polite"></aside></div>';
  document.getElementById('inputs').onsubmit=e=>{e.preventDefault()};
  document.getElementById('backBtn').onclick=()=>go('intro');
  document.getElementById('clearBtn').onclick=()=>{
    A.zip=A.city=A.household=A.incomeKind=A.amount=A.tenure='';
    workspace();
    focusHeading();
  };
  document.getElementById('city').addEventListener('input',e=>{A.city=e.target.value});
  document.getElementById('amount').addEventListener('input',e=>{A.amount=e.target.value.trim()});
  document.getElementById('zip').addEventListener('input',onZip);
  panel.querySelectorAll('.option').forEach(btn=>{
    btn.onclick=()=>{
      const group=btn.getAttribute('data-group');
      const id=btn.getAttribute('data-id');
      panel.querySelectorAll('[data-group="'+group+'"]').forEach(b=>b.setAttribute('aria-pressed',b===btn?'true':'false'));
      if(group==='household') A.household=id;
      if(group==='tenure') A.tenure=id;
      if(group==='income'){
        A.incomeKind=id;
        const wrap=document.getElementById('amountWrap');
        wrap.hidden=id==='skip';
        if(id==='skip') A.amount='';
      }
    };
  });
  drawResults();
  if(/^\d{5}(-\d{4})?$/.test(A.zip)) onZip();
}
function onZip(){
  const zip=document.getElementById('zip').value.trim();
  const status=document.getElementById('zipStatus');
  A.zip=zip;
  if(!zip){status.textContent='';drawResults();return}
  if(!/^\d{5}(-\d{4})?$/.test(zip)){
    status.textContent=zip.length>=5?'Use a 5-digit ZIP code.':'';
    drawResults();
    return;
  }
  status.textContent='Looking up that ZIP.';
  const token=++renderGen;
  loadZipShard(zip).catch(function(){bundle.crosswalk.zips=[]}).then(function(){
    if(token!==renderGen) return;
    const node=document.getElementById('zipStatus');
    if(node) node.textContent='';
    drawResults();
  });
}
function metroName(geoId){
  const row=(bundle.nationalTables.rows||[]).find(r=>r.geoLevel==='cbsa'&&r.geoId===geoId&&r.geoName);
  return row?String(row.geoName).replace(/\s*\(Metropolitan Statistical Area\)\s*$/i,''):geoId;
}
function gulfMetros(){
  const map=new Map();
  (bundle.areas||[]).forEach(area=>{
    if(!map.has(area.cbsa)) map.set(area.cbsa,{geoId:area.cbsa,places:[]});
    map.get(area.cbsa).places.push(area.name);
  });
  const colors=[GOLD,SLATE];
  return [...map.values()].map((metro,i)=>{
    const figure=bundle.figures.find(f=>f.categoryId==='price-index'&&(f.componentId||null)===null&&f.geoId===metro.geoId&&isSourced(f));
    return figure?{geoId:metro.geoId,name:metroName(metro.geoId),places:metro.places,figure,color:colors[Math.min(i,colors.length-1)]}:null;
  }).filter(Boolean);
}
function readerFigure(componentId){
  if(!/^\d{5}(-\d{4})?$/.test(A.zip)) return {figure:null,level:'',keys:null};
  return CostLookup.lookup(bundle,A.zip,'price-index',componentId||null);
}
function placePhrase(found){
  if(!found||!found.figure) return '';
  const keys=found.keys||{};
  if(found.level==='metro value') return keys.cbsaName||found.figure.geoName||'';
  if(found.level==='county value') return keys.countyName||'';
  if(found.level==='state value') return keys.state?keys.state:'';
  if(found.level==='ZIP value') return keys.zip?'ZIP '+keys.zip:'';
  return '';
}
function sourceLine(figures){
  const links=[];
  figures.filter(isSourced).forEach(figure=>{
    if(!figure.url||links.some(link=>link.url===figure.url)) return;
    links.push({url:figure.url,label:figure.linkLabel||figure.source||'Source'});
  });
  const year=figures.find(isSourced);
  const asOf=year&&year.asOf?year.asOf:'2024';
  const name=(year&&year.source)||'U.S. Bureau of Economic Analysis, Regional Price Parities';
  const anchors=links.map(link=>'<a href="'+esc(link.url)+'" target="_blank" rel="noopener noreferrer">'+esc(link.label)+'</a>').join(' ');
  return '<p class="source">Source: '+esc(name)+', '+esc(asOf)+'. '+anchors+'</p>';
}
function bars(items){
  const mark=(100/SCALE*100).toFixed(2);
  return '<div class="chart">'+items.map(item=>{
    const width=Math.max(0,Math.min(100,item.value/SCALE*100)).toFixed(2);
    const gold=item.color===GOLD?' barGold':'';
    return '<div class="barRow"><div class="barName">'+esc(item.name)+'</div><div class="barValue">'+esc(item.display)+'</div><div class="barTrack"><span class="usMark" style="left:'+mark+'%"></span><span class="bar'+gold+'" style="width:'+width+'%;background:'+item.color+'"></span></div></div>';
  }).join('')+'</div>';
}
function legend(items){
  return '<ul class="legend">'+items.map(item=>'<li><span class="swatch" style="background:'+item.color+'"></span>'+esc(item.name)+'</li>').join('')+'</ul>';
}
function drawResults(){
  const root=document.getElementById('results');
  if(!root||!bundle) return;
  const metros=gulfMetros();
  const reader=readerFigure(null);
  const yours=isSourced(reader.figure)?reader.figure:null;
  const place=placePhrase(reader);
  const headline=yours|| (metros[0]&&metros[0].figure);
  const kicker=yours?'Your price index':(metros[0]?metros[0].name:'Price index');
  const noteBits=[];
  if(yours&&place) noteBits.push(place);
  noteBits.push('U.S. average is 100');
  if(headline&&headline.asOf) noteBits.push(String(headline.asOf));
  let zipNote='';
  if(A.zip&&/^\d{5}(-\d{4})?$/.test(A.zip)&&!yours) zipNote='<p>No price index for this ZIP.</p>';
  else if(!yours) zipNote='<p>Enter a ZIP code to add your area.</p>';
  const series=[];
  if(yours) series.push({name:place?place:'Your area',display:yours.display,value:yours.value,color:NAVY,figure:yours});
  metros.forEach(metro=>series.push({name:metro.name,display:metro.figure.display,value:metro.figure.value,color:metro.color,figure:metro.figure,places:metro.places}));
  const rows=series.map(item=>'<tr><th scope="row">'+esc(item.name)+(item.places?'<span class="sub">'+esc(item.places.join(', '))+'</span>':'')+'</th><td>'+esc(item.display)+'</td></tr>').join('');
  const category=(bundle.categories||[]).find(c=>c.id==='price-index');
  const components=(category&&category.components)||[];
  const partSeries=components.map(component=>{
    const columns=[];
    const found=readerFigure(component.id);
    if(isSourced(found.figure)) columns.push({name:place?place:'Your area',display:found.figure.display,value:found.figure.value,color:NAVY,figure:found.figure});
    metros.forEach(metro=>{
      const figure=bundle.figures.find(f=>f.categoryId==='price-index'&&f.componentId===component.id&&f.geoId===metro.geoId&&isSourced(f));
      if(figure) columns.push({name:metro.name,display:figure.display,value:figure.value,color:metro.color,figure});
    });
    return columns.length?{label:component.label,columns}:null;
  }).filter(Boolean);
  const partTable=partSeries.length?'<table class="parts"><caption class="sr">Parts of the price index, U.S. = 100</caption><thead><tr><th scope="col">Part</th>'+partSeries[0].columns.map(col=>'<th scope="col">'+esc(col.name)+'</th>').join('')+'</tr></thead><tbody>'+partSeries.map(part=>'<tr><th scope="row">'+esc(part.label)+'</th>'+part.columns.map(col=>'<td>'+esc(col.display)+'</td>').join('')+'</tr>').join('')+'</tbody></table>':'';
  const partFigures=[];
  partSeries.forEach(part=>part.columns.forEach(col=>partFigures.push(col.figure)));
  const partChart=partSeries.length?partSeries.map(part=>'<h3>'+esc(part.label)+'</h3>'+bars(part.columns)).join('')+sourceLine(partFigures):'';
  const indexChart=series.length?bars(series)+'<p class="chartNote">The line is the U.S. average, 100.</p>'+legend(series)+sourceLine(series.map(item=>item.figure)):'';
  root.innerHTML='<p class="kicker">'+esc(kicker)+'</p>'+(headline?'<p class="big">'+esc(headline.display)+'</p>':'')+'<p class="bigNote">'+esc(noteBits.join(' · '))+'</p>'+zipNote+'<div class="breakdown"><h2>Gulf Coast comparison</h2><div class="tableWrap"><table class="indexTable"><caption class="sr">All-items price index, U.S. = 100</caption><tbody>'+rows+'</tbody></table></div>'+indexChart+(partTable?'<h2>Parts of the index</h2><div class="tableWrap">'+partTable+'</div>'+partChart:'')+'</div>'+bookingLink();
}
window.addEventListener('popstate',()=>render(location.hash==='#compare'?'compare':'intro'));
fetch('cost-of-living.json').then(r=>{if(!r.ok) throw new Error('bundle');return r.json()}).then(data=>{
  bundle=data;
  if(!bundle.crosswalk.zips) bundle.crosswalk.zips=[];
  render(location.hash==='#compare'?'compare':'intro');
}).catch(()=>{
  panel.innerHTML='<article class="sheet narrow"><h2>The comparison could not load</h2><p>Refresh the page.</p></article>';
});
</script>
</body>
</html>
