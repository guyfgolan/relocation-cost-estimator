<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cost of Living Estimator | Florida Gulf Coast Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
@font-face{font-family:Cinzel;src:url("../assets/fonts/Cinzel-VF.ttf") format("truetype");font-weight:100 900;font-style:normal;font-display:swap}
:root{--navy:#001F3F;--gold:#D4AF37;--paper:#F5F7FA;--slate:#5A7A9A;--line:#808A98;--white:#fff;--gray:#4E5964}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0;min-height:100%;background:var(--paper);color:var(--navy);font-family:Inter,Arial,Helvetica,sans-serif;font-size:16px;line-height:1.5}
button,input{font:inherit;color:inherit}
.skip{position:absolute;left:12px;top:-48px;background:var(--gold);color:var(--navy);padding:8px 12px;z-index:9;font-weight:700;border-radius:8px}
.skip:focus{top:8px}
.siteHeader,.siteFooter,.ctaBand,.headlineBand{background:var(--navy);color:var(--white);text-align:center}
.siteHeader{padding:28px 16px 22px}
.logo,.ctaLogo{height:auto;display:block;margin:0 auto;background:none;border:0}
.logo{width:min(480px,88vw)}
.ctaLogo{width:min(320px,72vw)}
.siteTitle{margin:8px 0 0;font-family:Cinzel,Georgia,"Times New Roman",serif;font-weight:600;letter-spacing:.08em;text-transform:uppercase;line-height:1.15}
.titleLine{display:block;font-size:clamp(28px,4vw,44px)}
.titleGold{color:var(--gold)}
.siteTitle::after{content:"";display:block;width:72px;height:2px;margin:12px auto 0;background:var(--gold)}
main{padding:20px 16px 36px}
.sheet{width:min(760px,100%);margin:0 auto;background:var(--white);border:1px solid var(--line);border-radius:8px;padding:clamp(18px,3vw,28px)}
.stepLabel{font-weight:700;margin:0 0 8px}
.progress{height:4px;background:#E4E8ED;border-radius:8px;overflow:hidden;margin:0 0 22px}
.progress>div{height:100%;background:var(--gold)}
h2{font-family:Cinzel,Georgia,"Times New Roman",serif;font-weight:600;letter-spacing:.04em;text-transform:uppercase;line-height:1.2;margin:0 0 18px;font-size:clamp(30px,5vw,46px)}
h2::after{content:"";display:block;width:64px;height:2px;margin-top:12px;background:var(--gold)}
.quiet{display:block;margin-top:8px;font-family:Inter,Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;letter-spacing:0;text-transform:none}
p{margin:0 0 12px}
label{font-weight:700;display:block;margin-bottom:6px}
.choices{display:grid;gap:8px}
.choices.two{grid-template-columns:1fr 1fr}
.choices.wide{grid-template-columns:1fr 1fr}
.option,.primary,.secondary{border-radius:8px;cursor:pointer;min-height:44px;padding:12px 14px}
.option{width:100%;text-align:left;background:var(--white);border:1px solid var(--line);font-weight:600}
.option[aria-pressed="true"]{background:var(--navy);color:var(--white);border-color:var(--navy)}
.primary{display:inline-flex;align-items:center;justify-content:center;background:var(--gold);color:var(--navy);border:1px solid var(--gold);font-weight:700;text-decoration:none;text-align:center}
.secondary{background:var(--white);color:var(--navy);border:1px solid var(--navy);font-weight:700}
.secondary:disabled{opacity:.45;cursor:not-allowed}
input{width:100%;background:var(--white);border:1px solid var(--line);border-radius:8px;padding:12px 14px;min-height:44px}
.stepBar{display:flex;gap:12px;margin-top:22px}
.stepBar>*{flex:1 1 140px}
.status{min-height:1.4em;margin:8px 0 0;font-weight:600}
.resultsWrap{width:min(1120px,100%);margin:0 auto}
.headlineBand{border:1px solid var(--gold);border-radius:8px;padding:22px 18px;margin-bottom:16px}
.compareHeadline{font-family:Cinzel,Georgia,"Times New Roman",serif;font-weight:600;font-size:clamp(28px,4vw,42px);line-height:1.25;color:var(--gold);text-transform:none;letter-spacing:0;margin:0;text-wrap:balance}
.compareHeadline::after{display:none}
.tableWrap{overflow-x:auto;max-width:100%;border:1px solid var(--line);border-radius:8px;background:var(--white)}
.compare{width:100%;border-collapse:separate;border-spacing:0;font-size:16px}
.compare th,.compare td{padding:10px 12px;vertical-align:bottom;background:var(--white)}
.compare thead th{font-weight:700;text-align:left}
.compare tbody th{font-weight:700;text-align:left;position:sticky;left:0;z-index:2;min-width:8.5rem}
.compare td{text-align:right;font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.compare tbody tr:nth-child(even) th,.compare tbody tr:nth-child(even) td{background:var(--paper)}
.compare .yours{position:sticky;left:8.5rem;z-index:3;background:var(--navy);color:var(--white)}
.compare thead .yours{z-index:4}
.compare tbody tr:nth-child(even) td.yours,.compare tbody tr:nth-child(odd) td.yours,.compare thead th.yours{background:var(--navy);color:var(--white)}
.compare th.best,.compare td.best{border-left:1px solid var(--gold);border-right:1px solid var(--gold)}
.compare thead th.best{border-top:1px solid var(--gold)}
.compare tbody tr:last-child td.best{border-bottom:1px solid var(--gold)}
.tag{display:inline-block;margin-top:4px;padding:2px 6px;border-radius:8px;background:var(--gold);color:var(--navy);font-family:Inter,Arial,Helvetica,sans-serif;font-size:12px;font-weight:700;letter-spacing:0;text-transform:none;line-height:1.3}
.cards{display:grid;gap:12px}
.areaCard{background:var(--white);border:1px solid var(--line);border-radius:8px;padding:14px}
.areaCard.yours{background:var(--navy);color:var(--white);border-color:var(--navy);position:sticky;top:8px;z-index:3}
.areaCard.best{border:1px solid var(--gold)}
.areaCard h3{margin:0 0 8px;font-family:Cinzel,Georgia,"Times New Roman",serif;font-size:18px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.metric{display:flex;justify-content:space-between;gap:12px;padding:8px 0}
.metric+.metric{border-top:1px solid var(--line)}
.areaCard.yours .metric+.metric{border-top-color:rgba(255,255,255,.35)}
.metric b{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.credit{color:var(--gray);font-size:14px;margin:14px 0 0}
.credit a{color:var(--gray)}
.ctaBand{margin-top:22px;border-radius:8px;padding:28px 16px}
.ctaBand .primary{margin-top:16px;min-width:min(100%,280px)}
.siteFooter{padding:22px 16px 28px}
.siteFooter p{margin:0 0 6px}
.siteFooter a{color:var(--white)}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
:focus:not(:focus-visible){outline:none}
:focus-visible{outline:2px solid var(--navy);outline-offset:2px;box-shadow:0 0 0 2px var(--gold)}
.headlineBand :focus-visible,.ctaBand :focus-visible,.siteHeader :focus-visible,.siteFooter :focus-visible,.areaCard.yours :focus-visible,.compare .yours :focus-visible{outline:2px solid var(--gold);outline-offset:2px;box-shadow:0 0 0 2px var(--navy)}
@media(min-width:800px){
 .choices.wide{grid-template-columns:1fr 1fr 1fr}
}
@media(max-width:799px){
 .choices.two,.choices.wide{grid-template-columns:1fr}
 .sheet .stepBar{position:sticky;bottom:0;z-index:5;background:var(--white);padding-top:12px;padding-bottom:4px}
}
@media(prefers-reduced-motion:reduce){
 *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;scroll-behavior:auto !important}
}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="siteHeader">
<img class="logo" src="logo_h_white.png" alt="Florida Gulf Coast Guide">
<h1 class="siteTitle"><span class="titleLine">Cost of living</span><span class="titleLine titleGold">Estimator</span></h1>
</header>
<main id="main"><div id="panel"></div></main>
<footer class="siteFooter">
<p>Guy Golan, eXp Realty</p>
<p><a href="tel:+13019196726">301-919-6726</a></p>
<p><a href="../">Moving cost estimator</a></p>
</footer>
<script src="lookup.js"></script>
<script>
const BOOKING_URL='https://calendar.app.google/5xtMmGSY9kCY5NRk7';
const STEPS=['from','household','income','tenure','results'];
const QUESTIONS=[
  {id:'from',title:'Where are you moving from?'},
  {id:'household',title:'How many people are in your household?'},
  {id:'income',title:"What's your yearly household income?"},
  {id:'tenure',title:'Will you rent or buy?'}
];
const A={zip:'',household:'',amount:'',tenure:''};
let bundle=null;
let renderGen=0;
const panel=document.getElementById('panel');
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function focusHeading(){
  const h=panel.querySelector('h2');
  if(!h)return;
  h.tabIndex=-1;
  h.focus({focusVisible:false});
}
function bookingLink(){
  return '<a class="primary" href="'+esc(BOOKING_URL)+'" target="_blank" rel="noopener noreferrer">Schedule a call with Guy</a>';
}
function isSourced(figure){
  return !!figure && typeof figure.value==='number' && !Number.isNaN(figure.value) && figure.evidence==='MEASURED' && /^[\d.]+$/.test(String(figure.display||''));
}
function go(step){
  const name=STEPS.includes(step)?step:'from';
  history.pushState({step:name},'','#'+name);
  render(name);
}
function loadZipShard(zip){
  const raw=String(zip||'');
  const code=/^\d{5}(-\d{4})?$/.test(raw)?raw.slice(0,5):'';
  if(!code){
    bundle.crosswalk.zips=[];
    bundle.crosswalk.loadedPrefix='';
    return Promise.resolve();
  }
  const prefix=code.slice(0,3);
  if(bundle.crosswalk.loadedPrefix===prefix && Array.isArray(bundle.crosswalk.zips)) return Promise.resolve();
  return fetch('zips/'+prefix+'.json').then(function(res){
    if(!res.ok) throw new Error('missing shard');
    return res.json();
  }).then(function(shard){
    bundle.crosswalk.zips=shard.zips||[];
    bundle.crosswalk.loadedPrefix=prefix;
  });
}
function render(step){
  if(step==='results') showResults();
  else showStep(QUESTIONS.some(q=>q.id===step)?step:'from');
}
function progress(n){
  return '<p class="stepLabel" id="stepLabel">Step '+n+' of 4</p><div class="progress" role="progressbar" aria-valuemin="1" aria-valuemax="4" aria-valuenow="'+n+'" aria-labelledby="stepLabel"><div style="width:'+(n/4*100)+'%"></div></div>';
}
function stepBar(n){
  return '<div class="stepBar"><button type="button" class="secondary" id="backBtn"'+(n===1?' disabled':'')+'>Back</button><button type="button" class="primary" id="nextBtn">Next</button></div>';
}
function choices(group, items, current){
  return '<div class="choices'+(items.length>2?' wide':' two')+'" role="group">'+items.map(item=>'<button type="button" class="option" data-group="'+esc(group)+'" data-id="'+esc(item.id)+'" aria-pressed="'+(current===item.id?'true':'false')+'">'+esc(item.label)+'</button>').join('')+'</div>';
}
function showStep(id){
  const q=QUESTIONS.find(item=>item.id===id);
  const n=QUESTIONS.indexOf(q)+1;
  let fields='';
  if(id==='from'){
    fields='<label for="zip">ZIP code</label><input id="zip" inputmode="numeric" autocomplete="postal-code" maxlength="10" value="'+esc(A.zip)+'"><p class="status" id="zipStatus" role="status"></p>';
  }else if(id==='household'){
    fields=choices('household',[{id:'1',label:'1 person'},{id:'2',label:'2 people'},{id:'3',label:'3 people'},{id:'4',label:'4 people'},{id:'5+',label:'5 or more'}],A.household);
  }else if(id==='income'){
    fields='<label for="amount">Yearly household income</label><input id="amount" inputmode="decimal" autocomplete="off" value="'+esc(A.amount)+'"><p>It stays in this browser and is not saved.</p>';
  }else{
    fields=choices('tenure',[{id:'rent',label:'Rent'},{id:'buy',label:'Buy'}],A.tenure);
  }
  const optional=id==='income'?' <span class="quiet">(optional)</span>':'';
  panel.innerHTML='<article class="sheet">'+progress(n)+'<h2>'+esc(q.title)+optional+'</h2>'+fields+stepBar(n)+'</article>';
  const back=document.getElementById('backBtn');
  back.onclick=()=>{if(n>1){saveStep(id);go(QUESTIONS[n-2].id)}};
  document.getElementById('nextBtn').onclick=()=>advance(id,n);
  panel.querySelectorAll('.option').forEach(btn=>{
    btn.onclick=()=>{
      const group=btn.getAttribute('data-group');
      const picked=btn.getAttribute('data-id');
      panel.querySelectorAll('[data-group="'+group+'"]').forEach(other=>other.setAttribute('aria-pressed',other===btn?'true':'false'));
      if(group==='household') A.household=picked;
      if(group==='tenure') A.tenure=picked;
    };
  });
  const formInput=panel.querySelector('input');
  if(formInput) formInput.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();advance(id,n)}});
  focusHeading();
}
function saveStep(id){
  if(id==='from'){
    const zip=document.getElementById('zip');
    if(zip) A.zip=zip.value.trim();
  }
  if(id==='income'){
    const amount=document.getElementById('amount');
    if(amount) A.amount=amount.value.trim();
  }
}
function advance(id,n){
  saveStep(id);
  if(id==='from' && A.zip && !/^\d{5}(-\d{4})?$/.test(A.zip)){
    document.getElementById('zipStatus').textContent='Use a 5-digit ZIP code.';
    return;
  }
  if(n<4) go(QUESTIONS[n].id);
  else go('results');
}
function showResults(){
  const token=++renderGen;
  panel.innerHTML='<article class="sheet"><h2>Your comparison</h2><p>One moment.</p></article>';
  focusHeading();
  loadZipShard(A.zip).catch(function(){bundle.crosswalk.zips=[]}).then(function(){
    if(token!==renderGen) return;
    drawResults();
    focusHeading();
  });
}
function readerFigure(componentId){
  if(!/^\d{5}(-\d{4})?$/.test(A.zip)) return {figure:null,level:'',keys:null};
  return CostLookup.lookup(bundle,A.zip,'price-index',componentId||null);
}
function placePhrase(found){
  if(!found||!isSourced(found.figure)) return '';
  const keys=found.keys||{};
  if(found.level==='metro value') return keys.cbsaName||'';
  if(found.level==='county value') return keys.countyName||'';
  if(found.level==='state value') return keys.state||'';
  if(found.level==='ZIP value') return keys.zip?'ZIP '+keys.zip:'';
  return '';
}
function gulfAreas(){
  return (bundle.areas||[]).map(area=>{
    const figure=bundle.figures.find(f=>f.areaId===area.id&&f.categoryId==='price-index'&&(f.componentId||null)===null&&isSourced(f));
    return figure?{id:area.id,name:area.name,value:figure.value,display:figure.display,figure}:null;
  }).filter(Boolean).sort((a,b)=>a.value-b.value||a.name.localeCompare(b.name));
}
function areaFigure(areaId, componentId){
  return bundle.figures.find(f=>f.areaId===areaId&&f.categoryId==='price-index'&&(f.componentId||null)===(componentId||null)&&isSourced(f))||null;
}
function joinNames(names){
  if(names.length<=1) return names[0]||'';
  if(names.length===2) return names[0]+' and '+names[1];
  return names.slice(0,-1).join(', ')+', and '+names[names.length-1];
}
function comparisonSentence(reader, areas){
  if(!reader||!areas.length) return '';
  const lowest=areas[0].value;
  const best=areas.filter(area=>area.value===lowest);
  const gulf=best[0].value;
  const home=reader.value;
  if(!home) return '';
  const pct=Math.round(Math.abs(gulf-home)/home*100);
  const where=joinNames(best.map(area=>area.name));
  const homeName=reader.name;
  if(pct===0) return 'Living in '+where+' costs about the same as '+homeName+'.';
  const word=gulf>home?'more':'less';
  return 'Living in '+where+' costs about '+pct+'% '+word+' than '+homeName+'.';
}
function cellText(figure){
  return figure?esc(figure.display):'\u2014';
}
function censusCredit(){
  const source=((bundle.crosswalk&&bundle.crosswalk.sources)||[])[0];
  if(!source) return '';
  const label=source.url?'<a href="'+esc(source.url)+'">'+esc(source.name)+'</a>':esc(source.name);
  return '<p class="credit">ZIP lookup: '+label+'.</p>';
}
function drawResults(){
  const readerHit=readerFigure(null);
  const reader=isSourced(readerHit.figure)?{name:placePhrase(readerHit)||'your area',value:readerHit.figure.value,display:readerHit.figure.display,figure:readerHit.figure}:null;
  const areas=gulfAreas();
  const lowest=areas.length?areas[0].value:null;
  const columns=[{id:'reader',name:'Your area',best:false,reader:true}].concat(areas.map(area=>({id:area.id,name:area.name,best:area.value===lowest,reader:false,value:area.value})));
  const category=(bundle.categories||[]).find(c=>c.id==='price-index');
  const parts=[{id:null,label:'Price index'}].concat((category&&category.components)||[]).filter(part=>{
    const readerPart=part.id?readerFigure(part.id).figure:readerHit.figure;
    if(isSourced(readerPart)) return true;
    return areas.some(area=>areaFigure(area.id,part.id));
  });
  function figureFor(column, part){
    if(column.reader) return isSourced(part.id?readerFigure(part.id).figure:readerHit.figure)?(part.id?readerFigure(part.id).figure:readerHit.figure):null;
    return areaFigure(column.id, part.id);
  }
  const head='<tr><th scope="col"><span class="sr">Category</span></th>'+columns.map(column=>'<th scope="col" class="'+(column.reader?'yours':column.best?'best':'')+'">'+esc(column.name)+(column.best?'<span class="tag">Best value</span>':'')+'</th>').join('')+'</tr>';
  const body=parts.map(part=>'<tr><th scope="row">'+esc(part.label)+'</th>'+columns.map(column=>'<td class="'+(column.reader?'yours':column.best?'best':'')+'">'+cellText(figureFor(column,part))+'</td>').join('')+'</tr>').join('');
  const cards=columns.map(column=>{
    const metrics=parts.map(part=>'<div class="metric"><span>'+esc(part.label)+'</span><b>'+cellText(figureFor(column,part))+'</b></div>').join('');
    return '<article class="areaCard'+(column.reader?' yours':column.best?' best':'')+'"><h3>'+esc(column.name)+(column.best?' <span class="tag">Best value</span>':'')+'</h3>'+metrics+'</article>';
  }).join('');
  const sentence=reader?comparisonSentence(reader,areas):'';
  const headline=sentence?'<h2 class="compareHeadline">'+esc(sentence)+'</h2>':'<h2 class="compareHeadline">Your Gulf Coast comparison</h2>';
  panel.innerHTML='<div class="resultsWrap"><div class="headlineBand">'+headline+'</div><div class="tableWrap" id="compareTable"><table class="compare"><caption class="sr">Price index comparison. U.S. average is 100.</caption><thead>'+head+'</thead><tbody>'+body+'</tbody></table></div><div class="cards" id="compareCards">'+cards+'</div><p class="credit">Source: U.S. Bureau of Economic Analysis, Regional Price Parities 2024.</p>'+censusCredit()+'<div class="stepBar"><button type="button" class="secondary" id="backBtn">Back</button></div><section class="ctaBand"><img class="ctaLogo" src="logo_h_white.png" alt="Florida Gulf Coast Guide">'+bookingLink()+'</section></div>';
  document.getElementById('backBtn').onclick=()=>go('tenure');
  layoutResults();
}
function layoutResults(){
  const mobile=window.matchMedia('(max-width: 799px)').matches;
  const table=document.getElementById('compareTable');
  const cards=document.getElementById('compareCards');
  if(table) table.hidden=mobile;
  if(cards) cards.hidden=!mobile;
}
window.addEventListener('resize',layoutResults);
window.addEventListener('popstate',()=>{
  const step=(location.hash||'#from').replace('#','');
  render(STEPS.includes(step)?step:'from');
});
fetch('cost-of-living.json').then(r=>{if(!r.ok) throw new Error('bundle');return r.json()}).then(data=>{
  bundle=data;
  if(!bundle.crosswalk.zips) bundle.crosswalk.zips=[];
  const step=(location.hash||'#from').replace('#','');
  render(STEPS.includes(step)?step:'from');
}).catch(()=>{
  panel.innerHTML='<article class="sheet"><h2>The comparison could not load</h2><p>Refresh the page.</p></article>';
});
</script>
</body>
</html>
