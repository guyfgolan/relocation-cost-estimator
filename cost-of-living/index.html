<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cost of Living Estimator | Florida Gulf Coast Guide</title>
<link rel="icon" href="favicon.ico" type="image/x-icon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
@font-face{font-family:Cinzel;src:url("../assets/fonts/Cinzel-VF.ttf") format("truetype");font-weight:100 900;font-style:normal;font-display:swap}
:root{--navy:#001F3F;--gold:#D4AF37;--paper:#F5F7FA;--slate:#5A7A9A;--line:#808A98;--white:#fff;--gray:#4E5964}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0;min-height:100%;background:var(--paper);color:var(--navy);font-family:Inter,Arial,Helvetica,sans-serif;font-size:16px;line-height:1.5}
body{min-height:100vh;display:flex;flex-direction:column}
button,input{font:inherit;color:inherit}
.skip{position:absolute;left:12px;top:-48px;background:var(--gold);color:var(--navy);padding:8px 12px;z-index:9;font-weight:700;border-radius:8px}
.skip:focus{top:8px}
.siteHeader,.siteFooter,.ctaBand,.headlineBand{background:var(--navy);color:var(--white);text-align:center}
.siteHeader{padding:28px 16px 22px}
.logo,.ctaLogo{height:auto;display:block;margin:0 auto;background:none;border:0}
.logo{width:min(480px,88vw)}
.ctaLogo{width:min(320px,72vw)}
.siteTitle{margin:8px 0 0;font-family:Cinzel,Georgia,"Times New Roman",serif;font-weight:600;letter-spacing:.08em;text-transform:uppercase;line-height:1.15}
.titleLine{display:block;font-size:clamp(28px,4vw,44px)}
.titleGold{color:var(--gold)}
.siteTitle::after{content:"";display:block;width:72px;height:2px;margin:12px auto 0;background:var(--gold)}
main{flex:1 0 auto;padding:20px 16px 36px}
.sheet{width:min(600px,100%);margin:0 auto;background:var(--white);border:1px solid var(--line);border-radius:8px;padding:clamp(18px,3vw,28px)}
.stepLabel{font-weight:700;margin:0 0 8px}
.progress{height:4px;background:#E4E8ED;border-radius:8px;overflow:hidden;margin:0 0 22px}
.progress>div{height:100%;background:var(--gold)}
h2{font-family:Cinzel,Georgia,"Times New Roman",serif;font-weight:600;letter-spacing:.04em;text-transform:uppercase;line-height:1.2;margin:0 0 18px;font-size:clamp(30px,5vw,46px)}
h2::after{content:"";display:block;width:64px;height:2px;margin-top:12px;background:var(--gold)}
.quiet{display:block;margin-top:8px;font-family:Inter,Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;letter-spacing:0;text-transform:none}
p{margin:0 0 12px}
label{font-weight:700;display:block;margin-bottom:6px}
.choices{display:grid;gap:8px}
.choices.two{grid-template-columns:1fr 1fr}
.choices.wide{grid-template-columns:1fr 1fr}
.option,.primary,.secondary{border-radius:8px;cursor:pointer;min-height:44px;padding:12px 14px}
.option{width:100%;text-align:left;background:var(--white);border:1px solid var(--line);font-weight:600}
.option[aria-pressed="true"]{background:var(--navy);color:var(--white);border-color:var(--navy)}
.primary{display:inline-flex;align-items:center;justify-content:center;background:var(--gold);color:var(--navy);border:1px solid var(--gold);font-weight:700;text-decoration:none;text-align:center}
.secondary{background:var(--white);color:var(--navy);border:1px solid var(--navy);font-weight:700}
.secondary:disabled{opacity:1;color:var(--gray);border-color:var(--gray);background:#E4E8ED;cursor:not-allowed}
input{width:100%;background:var(--white);border:1px solid var(--line);border-radius:8px;padding:12px 14px;min-height:44px}
.stepBar{display:flex;gap:12px;margin-top:22px}
.stepBar>*{flex:1 1 140px}
.status{min-height:1.4em;margin:8px 0 0;font-weight:600}
.resultsWrap{width:min(960px,100%);margin:0 auto;display:flex;flex-direction:column;gap:16px}
.resultsWrap .sheet{width:100%;max-width:none;margin:0}
.headlineBand{border:1px solid var(--gold);border-radius:8px;padding:22px 18px;margin:0}
.compareHeadline{font-family:Cinzel,Georgia,"Times New Roman",serif;font-weight:600;font-size:clamp(36px,5vw,56px);line-height:1.2;color:var(--gold);text-transform:none;letter-spacing:0;margin:0;text-wrap:balance}
.estimateLabel{margin:0 0 8px;color:var(--gold);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:14px}
.ctaBand .secondary{display:flex;margin:12px auto 0;min-width:min(100%,280px);background:transparent;color:var(--white);border-color:var(--gold)}
.compareHeadline::after{display:none}
.tableWrap{overflow-x:auto;max-width:100%;border:1px solid var(--line);border-radius:8px;background:var(--white)}
.compare{width:100%;border-collapse:separate;border-spacing:0;font-size:16px}
.compare th,.compare td{padding:10px 12px;vertical-align:bottom;background:var(--white)}
.compare thead th{font-weight:700;text-align:left}
.compare tbody th{font-weight:700;text-align:left;position:sticky;left:0;z-index:2;min-width:8.5rem}
.compare td{text-align:right;font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.compare tbody tr:nth-child(even) th,.compare tbody tr:nth-child(even) td{background:var(--paper)}
.compare .yours{position:sticky;left:8.5rem;z-index:3;background:var(--navy);color:var(--white)}
.compare thead .yours{z-index:4}
.compare tbody tr:nth-child(even) td.yours,.compare tbody tr:nth-child(odd) td.yours,.compare thead th.yours{background:var(--navy);color:var(--white)}
.compare th.best,.compare td.best{border-left:1px solid var(--gold);border-right:1px solid var(--gold)}
.compare thead th.best{border-top:1px solid var(--gold)}
.compare tbody tr:last-child td.best{border-bottom:1px solid var(--gold)}
.tag{display:inline-block;margin-top:4px;padding:2px 6px;border-radius:8px;background:var(--gold);color:var(--navy);font-family:Inter,Arial,Helvetica,sans-serif;font-size:12px;font-weight:700;letter-spacing:0;text-transform:none;line-height:1.3}
.cards{display:grid;gap:12px}
.areaCard{background:var(--white);border:1px solid var(--line);border-radius:8px;padding:14px}
.areaCard.yours{background:var(--navy);color:var(--white);border-color:var(--navy);position:sticky;top:8px;z-index:3}
.areaCard.best{border:1px solid var(--gold)}
.areaCard h3{margin:0 0 8px;font-family:Cinzel,Georgia,"Times New Roman",serif;font-size:18px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.metric{display:flex;justify-content:space-between;gap:12px;padding:8px 0}
.metric+.metric{border-top:1px solid var(--line)}
.areaCard.yours .metric+.metric{border-top-color:rgba(255,255,255,.35)}
.metric b{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.credit{color:var(--gray);font-size:14px;margin:14px 0 0}
.credit a{color:var(--gray)}
.help,.note{color:var(--gray);font-size:14px;margin:6px 0 0}
.field{margin:0 0 16px}
.pair{display:grid;gap:12px}
.route{font-weight:700;margin:0 0 8px}
.totalBox{margin-top:16px;border:1px solid var(--gold);border-radius:8px;padding:18px 16px;background:var(--navy);color:var(--white);text-align:center}
.totalBox p{margin:0 0 6px;color:var(--white)}
.totalBox .totalAmount{font-family:Cinzel,Georgia,"Times New Roman",serif;font-size:clamp(48px,7vw,72px);font-weight:600;line-height:1.05;margin:4px 0 8px;color:var(--gold);font-variant-numeric:tabular-nums}
.sourcesToggle{margin-top:14px;color:var(--gray);font-size:14px}
.sourcesToggle summary{cursor:pointer;font-weight:700;color:var(--gray)}
.sourcesToggle p{color:var(--gray);font-size:14px;margin:8px 0 0}
.check{display:flex;align-items:flex-start;gap:10px;font-weight:600}
.check input{width:auto;min-height:0;margin-top:4px}
.headlineBand p{color:var(--white);margin:12px 0 0}
.ctaBand{margin:0;border-radius:8px;padding:28px 16px}
.ctaBand .primary{margin-top:16px;min-width:min(100%,280px)}
.siteFooter{padding:22px 16px 28px}
.siteFooter p{margin:0 0 6px}
.siteFooter a{color:var(--white)}
.footerMove{margin:18px 0 0;padding-top:18px;border-top:1px solid rgba(212,175,55,.7);width:min(280px,80%)}
.expLogo{width:min(148px,46vw);height:auto;display:block;margin:10px auto 12px;background:none;border:0}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
:focus:not(:focus-visible){outline:none}
:focus-visible{outline:2px solid var(--navy);outline-offset:2px;box-shadow:0 0 0 2px var(--gold)}
.headlineBand :focus-visible,.ctaBand :focus-visible,.siteHeader :focus-visible,.siteFooter :focus-visible,.areaCard.yours :focus-visible,.compare .yours :focus-visible{outline:2px solid var(--gold);outline-offset:2px;box-shadow:0 0 0 2px var(--navy)}
@media(min-width:800px){
 .choices.wide{grid-template-columns:1fr 1fr 1fr}
 .pair{grid-template-columns:1fr 1fr}
 .siteFooter{display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
 .footerContact{grid-column:2}
 .footerMove{grid-column:3;justify-self:end;width:auto;margin:0;padding:0;border:0;text-align:right}
}
@media(max-width:799px){
 .choices.two,.choices.wide{grid-template-columns:1fr}
 .sheet .stepBar{position:sticky;bottom:0;z-index:5;background:var(--white);padding-top:12px;padding-bottom:4px}
}
@media(prefers-reduced-motion:reduce){
 *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;scroll-behavior:auto !important}
}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="siteHeader">
<img class="logo" src="logo_h_white.png" alt="Florida Gulf Coast Guide">
<h1 class="siteTitle"><span class="titleLine">Cost of living</span><span class="titleLine titleGold">Estimator</span></h1>
</header>
<main id="main"><div id="panel"></div></main>
<footer class="siteFooter">
<div class="footerContact">
<p>Guy Golan</p>
<img class="expLogo" src="exp_realty_logo_white_official.svg" alt="eXp Realty">
<p><a href="tel:+13019196726">301-919-6726</a></p>
</div>
<p class="footerMove"><a href="../">Moving cost estimator</a></p>
</footer>
<script src="lookup.js"></script>
<script src="estimate.js"></script>
<script>
const BOOKING_URL='https://calendar.app.google/5xtMmGSY9kCY5NRk7';
const STEPS=['from','to','household','income','now','plan','drive','other','results'];
const QUESTIONS=[
  {id:'from',title:'Where are you moving from?'},
  {id:'to',title:'Which Gulf Coast area?'},
  {id:'household',title:'How many people are in your household?'},
  {id:'income',title:"What's your household income range?"},
  {id:'now',title:'Do you own or rent now?'},
  {id:'plan',title:'Will you buy or rent in Florida?'},
  {id:'drive',title:'Will you be driving?'},
  {id:'other',title:'Anything else to include?'}
];
const FRAMING='General estimate for planning a conversation. Not a quote. Your actual costs depend on your home, coverage and habits.';
const REPORT='This is a general estimate built from published averages. It is not a quote or tax advice. Let\'s talk through your actual numbers.';
const A={zip:'',to:'',household:'',adults:'',adultsTouched:false,income:'',ownNow:'',planFL:'',primary:'',homeBudget:'',drives:'',vehicles:'',miles:'',fuel:'gas',mpg:'',miPerKwh:'',groceriesNow:'',hoaNow:'',hoaFL:'',flood:null,picks:{}};
let durations=[],flowStart=0,shownAt=0;
let bundle=null;
let factors=null;
let renderGen=0;
let busy=false;
const panel=document.getElementById('panel');
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function focusHeading(){
  const h=panel.querySelector('h2');
  if(!h)return;
  h.tabIndex=-1;
  h.focus({focusVisible:false});
}
function bookingLink(label){
  return '<a class="primary" href="'+esc(BOOKING_URL)+'" target="_blank" rel="noopener noreferrer">'+esc(label||'Schedule a call with Guy')+'</a>';
}
function noteShown(){const now=Date.now();if(!flowStart)flowStart=now;shownAt=now}
function noteLeft(){if(!shownAt)return;durations.push(Date.now()-shownAt);shownAt=0}
function recordPicks(){
  A.picks=A.picks||{};
  ['to','household','adults','income','ownNow','planFL','primary','drives','fuel'].forEach(group=>{
    const buttons=[...panel.querySelectorAll('[data-group="'+group+'"]')];
    if(!buttons.length)return;
    const index=buttons.findIndex(btn=>btn.getAttribute('aria-pressed')==='true');
    if(index>=0)A.picks[group]=index;
  });
}
function engagementMeta(){
  return {timing:{durationsMs:durations.slice(),elapsedMs:flowStart?Date.now()-flowStart:null},choiceIndexes:Object.keys(A.picks||{}).map(key=>A.picks[key]),samePosition:!!(factors&&factors.engagement&&factors.engagement.samePosition===true)};
}
function retake(){durations=[];flowStart=0;shownAt=0;go('from')}
function showLowInfo(){
  panel.innerHTML='<div class="resultsWrap"><div class="headlineBand"><p class="estimateLabel">Your Estimate</p><h2 class="compareHeadline">Thank you for filling out the information!</h2><p>It seems as if you are still narrowing down your plans, so a number right now might not tell you much. I encourage you to book a call. I am happy to help in any way I can.</p></div><section class="ctaBand"><img class="ctaLogo" src="logo_h_white.png" alt="Florida Gulf Coast Guide">'+bookingLink('Book a Call with Guy')+'<button type="button" class="secondary" id="retakeBtn">Retake</button></section></div>';
  document.getElementById('retakeBtn').onclick=retake;
  focusHeading();
}
function isSourced(figure){
  return !!figure && typeof figure.value==='number' && !Number.isNaN(figure.value) && figure.evidence==='MEASURED' && /^[\d.]+$/.test(String(figure.display||''));
}
function go(step){
  const name=STEPS.includes(step)?step:'from';
  history.pushState({step:name},'','#'+name);
  render(name);
}
function loadZipShard(zip){
  const raw=String(zip||'');
  const code=/^\d{5}(-\d{4})?$/.test(raw)?raw.slice(0,5):'';
  if(!code){
    bundle.crosswalk.zips=[];
    bundle.crosswalk.loadedPrefix='';
    return Promise.resolve();
  }
  const prefix=code.slice(0,3);
  if(bundle.crosswalk.loadedPrefix===prefix && Array.isArray(bundle.crosswalk.zips)) return Promise.resolve();
  return fetch('zips/'+prefix+'.json').then(function(res){
    if(!res.ok) throw new Error('missing shard');
    return res.json();
  }).then(function(shard){
    bundle.crosswalk.zips=shard.zips||[];
    bundle.crosswalk.loadedPrefix=prefix;
  });
}
function render(step){
  if(step==='results') showResults();
  else showStep(QUESTIONS.some(q=>q.id===step)?step:'from');
}
function progress(n){
  return '<p class="stepLabel" id="stepLabel">Step '+n+' of 8</p><div class="progress" role="progressbar" aria-valuemin="1" aria-valuemax="8" aria-valuenow="'+n+'" aria-labelledby="stepLabel"><div style="width:'+(n/8*100)+'%"></div></div>';
}
function stepBar(n){
  const nextLabel=n===8?'See your estimate':'Next';
  return '<div class="stepBar"><button type="button" class="secondary" id="backBtn"'+(n===1?' disabled':'')+'>Back</button><button type="button" class="primary" id="nextBtn">'+nextLabel+'</button></div>';
}
function choices(group, items, current){
  return '<div class="choices'+(items.length>2?' wide':' two')+'" role="group">'+items.map(item=>'<button type="button" class="option" data-group="'+esc(group)+'" data-id="'+esc(item.id)+'" aria-pressed="'+(current===item.id?'true':'false')+'">'+esc(item.label)+'</button>').join('')+'</div>';
}
function readChoice(group){
  const btn=panel.querySelector('.option[data-group="'+group+'"][aria-pressed="true"]');
  return btn?btn.getAttribute('data-id'):'';
}
function fieldValue(id){
  const el=document.getElementById(id);
  return el?el.value.trim():'';
}
function areaList(){
  const ids=(bundle.comparison&&bundle.comparison.gulfAreaIds)||[];
  return ids.map(id=>(bundle.areas||[]).find(area=>area.id===id)).filter(Boolean);
}
function selectedArea(){
  return areaList().find(area=>area.id===A.to)||null;
}
function configuredFloodPremium(areaId){
  var flood=factors.florida&&factors.florida.flood;
  if(!flood||flood.enabled!==true) return null;
  var table=flood.statistic==='average'?(flood.averages||flood.areas):flood.medians;
  if(!table) return null;
  if(table[areaId]!=null) return table[areaId];
  if((areaId==='venice'||areaId==='north-port')&&table.sarasota!=null) return table.sarasota;
  return null;
}
function defaultAdults(){
  const size=Number(A.household)||0;
  return size?String(Math.min(size,2)):'';
}
function bandRecord(){
  return (factors.incomeBands||[]).find(band=>band.id===A.income)||null;
}
function midpointCopy(band){
  if(!band) return '';
  const dollars=Number(band.midpoint).toLocaleString('en-US');
  let text='This estimate uses $'+dollars+', the middle of this range.';
  if(band.id==='250plus') text+=' That midpoint is halfway from $250,000 to $500,000.';
  return text;
}
function householdLabel(){
  if(A.household==='not-sure') return 'not sure';
  if(A.household==='1') return '1 person';
  if(A.household==='6') return '6 or more people';
  return A.household?A.household+' people':'';
}
function money(n, withPlus){
  if(n==null || Number.isNaN(Number(n))) return '\u2014';
  const rounded=Math.round(Number(n));
  const body='$'+Math.abs(rounded).toLocaleString('en-US');
  if(rounded<0) return '\u2212'+body;
  if(withPlus && rounded>0) return '+'+body;
  return body;
}
function asOfText(asOf){
  const full=/^(\d{4})-(\d{2})-(\d{2})$/.exec(asOf||'');
  if(full) return MONTHS[Number(full[2])-1]+' '+Number(full[3])+', '+full[1];
  const month=/^(\d{4})-(\d{2})$/.exec(asOf||'');
  if(month) return MONTHS[Number(month[2])-1]+' '+month[1];
  return asOf||'';
}
function numberOrBlank(value){
  if(value==='') return '';
  const n=Number(String(value).replace(/[$,]/g,''));
  if(!Number.isFinite(n) || n<0) return 'Enter a dollar amount, or leave it blank.';
  return '';
}
function countOrBlank(value){
  if(value==='') return '';
  const n=Number(value);
  if(!Number.isFinite(n) || n<=0) return 'Enter a number above zero.';
  return '';
}
function showStep(id){
  const q=QUESTIONS.find(item=>item.id===id);
  const n=QUESTIONS.indexOf(q)+1;
  let fields='';
  if(id==='from'){
    fields='<div class="field"><label for="zip">ZIP code</label><input id="zip" inputmode="numeric" autocomplete="postal-code" maxlength="10" spellcheck="false" value="'+esc(A.zip)+'"><p class="status" id="zipStatus" role="status"></p></div>';
  }else if(id==='to'){
    fields=choices('to',areaList().map(area=>({id:area.id,label:area.name})),A.to);
  }else if(id==='household'){
    const adults=A.adults||defaultAdults();
    fields='<div class="field">'+choices('household',[{id:'1',label:'1 person'},{id:'2',label:'2 people'},{id:'3',label:'3 people'},{id:'4',label:'4 people'},{id:'5',label:'5 people'},{id:'6',label:'6 or more'},{id:'not-sure',label:'Not sure'}],A.household)+'</div>';
    fields+='<div class="field"><label id="adultsLabel">How many adults?</label>'+choices('adults',[{id:'1',label:'1 adult'},{id:'2',label:'2 or more adults'}],adults)+'<p class="help">Used for the state income tax line. The default is one adult, or two when the household has two or more people.</p></div>';
  }else if(id==='income'){
    fields=choices('income',(factors.incomeBands||[]).map(band=>({id:band.id,label:band.label})).concat([{id:'not-sure',label:'Not sure'}]),A.income);
    fields+='<p id="midpoint" class="help">'+esc(midpointCopy(bandRecord()))+'</p><p>It stays in this browser and is not saved.</p>';
  }else if(id==='now'){
    fields=choices('ownNow',[{id:'own',label:'Own'},{id:'rent',label:'Rent'},{id:'not-sure',label:'Not sure'}],A.ownNow);
  }else if(id==='plan'){
    fields=choices('planFL',[{id:'buy',label:'Buy'},{id:'rent',label:'Rent'},{id:'not-sure',label:'Not sure'}],A.planFL);
    fields+='<div id="buyDetails"'+(A.planFL==='buy'?'':' hidden')+'><div class="field"><label id="primaryLabel">Is this your primary residence?</label>'+choices('primary',[{id:'yes',label:'Yes'},{id:'no',label:'No'}],A.primary)+'</div><div class="field"><label for="homeBudget">Home budget</label><input id="homeBudget" inputmode="decimal" autocomplete="off" value="'+esc(A.homeBudget)+'"><p class="help">Leave blank to use the area\'s median sale price.</p></div></div>';
  }else if(id==='drive'){
    fields=choices('drives',[{id:'yes',label:'Yes'},{id:'no',label:'No'},{id:'not-sure',label:'Not sure'}],A.drives);
    fields+='<div id="driveDetails"'+(A.drives==='yes'?'':' hidden')+'><div class="pair"><div class="field"><label for="vehicles">How many vehicles?</label><input id="vehicles" inputmode="numeric" autocomplete="off" value="'+esc(A.vehicles)+'"><p class="help">Default is 1.</p></div><div class="field"><label for="miles">Miles per month</label><input id="miles" inputmode="decimal" autocomplete="off" value="'+esc(A.miles)+'"><p class="help">Default is 1,000.</p></div></div><div class="field"><label id="fuelLabel">Gas or electric?</label>'+choices('fuel',[{id:'gas',label:'Gas'},{id:'ev',label:'Electric vehicle'}],A.fuel||'gas')+'</div><div class="field" id="mpgField"'+(A.fuel==='ev'?' hidden':'')+'><label for="mpg">Miles per gallon</label><input id="mpg" inputmode="decimal" autocomplete="off" value="'+esc(A.mpg)+'"><p class="help">Default is 25.</p></div><div class="field" id="kwhField"'+(A.fuel==='ev'?'':' hidden')+'><label for="miPerKwh">Miles per kilowatt-hour</label><input id="miPerKwh" inputmode="decimal" autocomplete="off" value="'+esc(A.miPerKwh)+'"><p class="help">Default is 3.5.</p></div></div>';
  }else{
    const area=selectedArea();
    const factorArea=factors.florida&&factors.florida.areas&&area?factors.florida.areas[area.id]:null;
    const floodReady=configuredFloodPremium(area?area.id:'')!=null;
    const floodOn=A.flood==null?A.planFL==='buy':!!A.flood;
    fields='<div class="field"><label for="groceriesNow">Current monthly grocery spending</label><input id="groceriesNow" inputmode="decimal" autocomplete="off" value="'+esc(A.groceriesNow)+'"><p class="help">Leave blank to use the USDA moderate food plan.</p></div>';
    fields+='<div class="pair"><div class="field"><label for="hoaNow">HOA or CDD now, per month</label><input id="hoaNow" inputmode="decimal" autocomplete="off" value="'+esc(A.hoaNow)+'"></div><div class="field"><label for="hoaFL">HOA or CDD in Florida, per month</label><input id="hoaFL" inputmode="decimal" autocomplete="off" value="'+esc(A.hoaFL)+'"><p class="help">The figure varies by community.</p></div></div>';
    if(floodReady) fields+='<label class="check"><input id="floodToggle" type="checkbox"'+(floodOn?' checked':'')+'>Include flood insurance estimate</label><p class="help">Flood coverage may be required by your lender depending on the property\'s flood zone.</p>';
  }
  const optional=id==='other'?' <span class="quiet">(optional)</span>':'';
  panel.innerHTML='<article class="sheet">'+progress(n)+'<h2>'+esc(q.title)+optional+'</h2><p>'+esc(FRAMING)+'</p>'+fields+'<p class="status" id="formStatus" role="status"></p>'+stepBar(n)+'</article>';
  document.getElementById('backBtn').onclick=()=>{if(n>1){saveStep(id);go(QUESTIONS[n-2].id)}};
  document.getElementById('nextBtn').onclick=()=>advance(id,n);
  panel.querySelectorAll('.option').forEach(btn=>{
    btn.onclick=()=>{
      const group=btn.getAttribute('data-group');
      const picked=btn.getAttribute('data-id');
      panel.querySelectorAll('[data-group="'+group+'"]').forEach(other=>other.setAttribute('aria-pressed',other===btn?'true':'false'));
      A[group]=picked;
      if(group==='adults') A.adultsTouched=true;
      if(group==='household' && !A.adultsTouched) paintAdults();
      if(group==='income'){
        const note=document.getElementById('midpoint');
        if(note) note.textContent=midpointCopy(bandRecord());
      }
      if(group==='planFL'){
        const buy=document.getElementById('buyDetails');
        if(buy) buy.hidden=picked!=='buy';
      }
      if(group==='drives'){
        const drive=document.getElementById('driveDetails');
        if(drive) drive.hidden=picked!=='yes';
      }
      if(group==='fuel'){
        const mpg=document.getElementById('mpgField');
        const kwh=document.getElementById('kwhField');
        if(mpg) mpg.hidden=picked==='ev';
        if(kwh) kwh.hidden=picked!=='ev';
      }
    };
  });
  panel.querySelectorAll('input').forEach(input=>{
    input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();advance(id,n)}});
  });
  focusHeading();
  noteShown();
}
function paintAdults(){
  const chosen=A.adults||defaultAdults();
  panel.querySelectorAll('[data-group="adults"]').forEach(btn=>btn.setAttribute('aria-pressed',btn.getAttribute('data-id')===chosen?'true':'false'));
}
function saveStep(id){
  if(id==='from') A.zip=fieldValue('zip');
  if(id==='to') A.to=readChoice('to');
  if(id==='household'){
    A.household=readChoice('household');
    A.adults=A.adultsTouched?readChoice('adults'):'';
  }
  if(id==='income') A.income=readChoice('income');
  if(id==='now') A.ownNow=readChoice('ownNow');
  if(id==='plan'){
    A.planFL=readChoice('planFL');
    A.primary=readChoice('primary');
    A.homeBudget=fieldValue('homeBudget');
  }
  if(id==='drive'){
    A.drives=readChoice('drives');
    A.vehicles=fieldValue('vehicles');
    A.miles=fieldValue('miles');
    A.fuel=readChoice('fuel')||A.fuel||'gas';
    A.mpg=fieldValue('mpg');
    A.miPerKwh=fieldValue('miPerKwh');
  }
  if(id==='other'){
    A.groceriesNow=fieldValue('groceriesNow');
    A.hoaNow=fieldValue('hoaNow');
    A.hoaFL=fieldValue('hoaFL');
    const flood=document.getElementById('floodToggle');
    if(flood) A.flood=flood.checked;
  }
}
function setStatus(id, message){
  const el=document.getElementById(id);
  if(el) el.textContent=message;
}
function advance(id,n){
  if(busy) return;
  recordPicks();
  saveStep(id);
  if(id==='from'){
    if(!A.zip){setStatus('zipStatus','Enter a 5-digit ZIP code.');return}
    if(!/^\d{5}(-\d{4})?$/.test(A.zip)){setStatus('zipStatus','Use a 5-digit ZIP code.');return}
    busy=true;
    document.getElementById('nextBtn').disabled=true;
    loadZipShard(A.zip).then(function(){
      const keys=CostLookup.resolveKeys(bundle.crosswalk,A.zip);
      if(!keys.state){setStatus('zipStatus','We couldn\'t match that ZIP, so this page has no comparison yet.');return}
      noteLeft();
      go('to');
    }).catch(function(){
      setStatus('zipStatus','We couldn\'t match that ZIP, so this page has no comparison yet.');
    }).then(function(){busy=false});
    return;
  }
  if(id==='to' && !A.to){setStatus('formStatus','Choose one to continue.');return}
  if(id==='household' && !A.household){setStatus('formStatus','Choose one to continue.');return}
  if(id==='income' && !A.income){setStatus('formStatus','Choose one to continue.');return}
  if(id==='now' && !A.ownNow){setStatus('formStatus','Choose one to continue.');return}
  if(id==='plan'){
    if(!A.planFL){setStatus('formStatus','Choose one to continue.');return}
    if(A.planFL==='buy' && !A.primary){setStatus('formStatus','Say whether this will be your primary residence.');return}
    const budget=CostEstimate.boundMessage('budget',A.homeBudget);
    if(budget){setStatus('formStatus',budget);return}
  }
  if(id==='drive'){
    if(!A.drives){setStatus('formStatus','Choose one to continue.');return}
    if(A.drives==='yes'){
      const vehicles=CostEstimate.boundMessage('vehicles',A.vehicles);
      const miles=CostEstimate.boundMessage('miles',A.miles);
      const rate=A.fuel==='ev'?countOrBlank(A.miPerKwh):countOrBlank(A.mpg);
      if(vehicles||miles||rate){setStatus('formStatus',vehicles||miles||rate);return}
    }
  }
  if(id==='other'){
    const grocery=numberOrBlank(A.groceriesNow);
    const hoaNow=numberOrBlank(A.hoaNow);
    const hoaFL=numberOrBlank(A.hoaFL);
    if(grocery||hoaNow||hoaFL){setStatus('formStatus',grocery||hoaNow||hoaFL);return}
  }
  noteLeft();
  if(n<8) go(QUESTIONS[n].id);
  else go('results');
}
function showResults(){
  const token=++renderGen;
  panel.innerHTML='<article class="sheet"><h2>Your comparison</h2><p>One moment.</p></article>';
  focusHeading();
  loadZipShard(A.zip).catch(function(){bundle.crosswalk.zips=[]}).then(function(){
    if(token!==renderGen) return;
    drawResults();
    focusHeading();
  });
}
function areaIndex(areaId, componentId){
  return (bundle.figures||[]).find(figure=>figure.areaId===areaId && figure.categoryId==='price-index' && (figure.componentId||null)===(componentId||null) && isSourced(figure))||null;
}
function originIndex(componentId){
  if(!/^\d{5}(-\d{4})?$/.test(A.zip)) return null;
  const hit=CostLookup.lookup(bundle,A.zip,'price-index',componentId||null);
  return isSourced(hit.figure)?hit:null;
}
function originPlace(keys){
  if(keys.countyName && keys.state) return keys.countyName+', '+keys.state;
  if(keys.cbsaName) return keys.cbsaName;
  if(keys.state && CostEstimate.STATE_NAME[keys.state]) return CostEstimate.STATE_NAME[keys.state];
  return '';
}
function floridaPlace(area){
  if(!area) return 'Florida';
  return /,\s*FL$/.test(area.name)?area.name:area.name+', FL';
}
function censusCredit(){
  const source=((bundle.crosswalk&&bundle.crosswalk.sources)||[])[0];
  if(!source||!source.name) return '';
  return '<p class="credit">ZIP lookup: '+esc(source.name)+'.</p>';
}
function lineNotes(row){
  const bits=[];
  if(row.originNote && row.originNote!==row.text) bits.push(row.originNote);
  if(row.floridaNote && row.floridaNote!==row.originNote) bits.push(row.floridaNote);
  return bits;
}
function cellValue(row, side, indexDisplay){
  if(row.text==='Not available') return 'Not available';
  if(row.index){
    if(side==='difference') return '\u2014';
    return esc(side==='origin'?indexDisplay.origin:indexDisplay.florida);
  }
  if(row.text && side==='difference') return esc(row.text);
  const value=side==='origin'?row.origin:side==='florida'?row.florida:row.difference;
  if(row.id==='median-price' && side==='difference') return '\u2014';
  return esc(money(value, side==='difference'));
}
function drawResults(){
  const ready=A.zip && A.to && A.household && A.income && A.ownNow && A.planFL && A.drives && (A.planFL!=='buy' || A.primary);
  const keys=ready?CostLookup.resolveKeys(bundle.crosswalk,A.zip):{state:''};
  const area=selectedArea();
  if(!ready || !keys.state || !area){
    const message=!keys.state && A.zip?'We couldn\'t match that ZIP, so this page has no comparison yet.':'Answer each question to see your estimate.';
    panel.innerHTML='<article class="sheet"><h2>Your comparison</h2><p>'+esc(message)+'</p><p>'+esc(FRAMING)+'</p><div class="stepBar"><button type="button" class="secondary" id="backBtn">Back</button></div></article><section class="ctaBand"><img class="ctaLogo" src="logo_h_white.png" alt="Florida Gulf Coast Guide"><p>'+esc(REPORT)+'</p>'+bookingLink()+'</section>';
    document.getElementById('backBtn').onclick=()=>go(ready&&!keys.state?'from':'other');
    return;
  }
  if(CostEstimate.lowInformation(A,engagementMeta()).show){
    showLowInfo();
    return;
  }
  const allOrigin=originIndex(null);
  const goodsOrigin=originIndex('goods');
  const utilOrigin=originIndex('utilities');
  const allFlorida=areaIndex(area.id,null);
  const goodsFlorida=areaIndex(area.id,'goods');
  const utilFlorida=areaIndex(area.id,'utilities');
  const factorArea=factors.florida&&factors.florida.areas?factors.florida.areas[area.id]:null;
  const floodChoice=configuredFloodPremium(area.id);
  const elec=factors.electricity||{};
  const gasOn=!!(factors.naturalGas&&factors.naturalGas.enabled===true&&factors.naturalGas.states);
  const adults=A.adults?Number(A.adults):Math.min(Number(A.household)||1,2);
  const result=CostEstimate.buildEstimate({
    state:keys.state,
    countyFips:keys.county,
    toArea:area.id,
    floridaName:area.name,
    originName:originPlace(keys),
    hhSize:A.household==='not-sure'?null:Number(A.household),
    adults:adults,
    incomeBand:A.income==='not-sure'?'':A.income,
    householdNotSure:A.household==='not-sure',
    incomeNotSure:A.income==='not-sure',
    ownNow:A.ownNow==='not-sure'?'':A.ownNow,
    planFL:A.planFL==='not-sure'?'':A.planFL,
    primary:A.primary==='yes',
    homeBudget:A.homeBudget,
    drives:A.drives==='yes',
    vehicles:A.vehicles===''?1:Number(A.vehicles),
    miles:A.miles===''?1000:Number(A.miles),
    fuel:A.fuel||'gas',
    mpg:A.mpg===''?25:Number(A.mpg),
    miPerKwh:A.miPerKwh===''?3.5:Number(A.miPerKwh),
    groceriesNow:A.groceriesNow,
    hoaNow:A.hoaNow,
    hoaFL:A.hoaFL,
    flood:floodChoice!=null && (A.flood==null?A.planFL==='buy':!!A.flood),
    originMedianValue:factors.originMedianPrice&&factors.originMedianPrice.counties?factors.originMedianPrice.counties[keys.county]:null,
    originEffRate:factors.originPropertyTax&&factors.originPropertyTax.counties?factors.originPropertyTax.counties[keys.county]:null,
    kwhOrigin:elec.kwhMonth?elec.kwhMonth[keys.state]:null,
    elecRateOrigin:elec.states?elec.states[keys.state]:null,
    kwhFlorida:elec.kwhMonth?elec.kwhMonth.FL:null,
    elecRateFlorida:elec.states?elec.states.FL:null,
    gasBillOrigin:gasOn?factors.naturalGas.states[keys.state]:null,
    gasBillFlorida:gasOn?factors.naturalGas.states.FL:null,
    nationalWater:factors.water?factors.water.national:null,
    rppOriginGoods:goodsOrigin?goodsOrigin.figure.value:null,
    rppFloridaGoods:goodsFlorida?goodsFlorida.value:null,
    rppOriginAll:allOrigin?allOrigin.figure.value:null,
    rppFloridaAll:allFlorida?allFlorida.value:null,
    rppOriginUtilities:utilOrigin?utilOrigin.figure.value:null,
    rppFloridaUtilities:utilFlorida?utilFlorida.value:null
  }, factors);
  const indexDisplay={
    origin:allOrigin?allOrigin.figure.display:'\u2014',
    florida:allFlorida?allFlorida.display:'\u2014'
  };
  const floridaName=area.name;
  const head='<tr><th scope="col"><span class="sr">Line</span></th><th scope="col" class="yours">Your area</th><th scope="col">'+esc(floridaName)+'</th><th scope="col">Difference</th></tr>';
  const body=result.lines.map(row=>{
    const notes=lineNotes(row);
    const note=notes.length?'<div class="note">'+notes.map(esc).join(' ')+'</div>':'';
    return '<tr><th scope="row">'+esc(row.label)+note+'</th><td class="yours">'+cellValue(row,'origin',indexDisplay)+'</td><td>'+cellValue(row,'florida',indexDisplay)+'</td><td>'+cellValue(row,'difference',indexDisplay)+'</td></tr>';
  }).join('');
  const cards=result.lines.map(row=>{
    const notes=lineNotes(row);
    return '<article class="areaCard"><h3>'+esc(row.label)+'</h3><div class="metric"><span>Your area</span><b>'+cellValue(row,'origin',indexDisplay)+'</b></div><div class="metric"><span>'+esc(floridaName)+'</span><b>'+cellValue(row,'florida',indexDisplay)+'</b></div><div class="metric"><span>Difference</span><b>'+cellValue(row,'difference',indexDisplay)+'</b></div>'+(notes.length?'<p class="note">'+notes.map(esc).join(' ')+'</p>':'')+'</article>';
  }).join('');
  const seen={};
  const sources=[];
  result.lines.forEach(row=>{
    (row.sources||[]).forEach(source=>{
      if(!source || !source.name) return;
      const key=source.name+'|'+source.asOf;
      if(seen[key]) return;
      seen[key]=true;
      sources.push(source);
    });
  });
  const sourceList=sources.map(function(source){
    const dated=asOfText(source.asOf);
    const name=source.name||'';
    return esc(dated && name.indexOf(dated)<0 ? name+', as of '+dated : name);
  }).join('. ');
  const band=bandRecord();
  const filing=adults>=2?'The state income tax line uses a joint return.':'The state income tax line uses a single return.';
  const evNote=A.drives==='yes' && A.fuel==='ev' && !result.lines.some(row=>row.id==='fuel')?'<p>Car insurance is included. Charging cost is not included in this estimate.</p>':'';
  const sentence=CostEstimate.alignedSentence(result.sentence,result.total.monthly,area.name,originPlace(keys));
  const headline=sentence?'<h2 class="compareHeadline">'+esc(sentence)+'</h2>':'<h2 class="compareHeadline">Your Gulf Coast comparison</h2>';
  const total='<div class="totalBox"><p>'+esc(result.total.label)+'</p><p class="totalAmount">'+esc(money(result.total.monthly,true))+'</p><p>Range '+esc(money(result.total.low))+' to '+esc(money(result.total.high))+'.</p><p>'+esc(money(result.total.yearly,true))+' a year.</p></div><p class="note">This total includes only the lines above.</p>';
  const notes=(result.notes||[]).map(note=>'<p>'+esc(note)+'</p>').join('');
  const sourceBlock=sourceList?'<details class="sourcesToggle"><summary>Sources</summary><p>'+sourceList+'.</p></details>':'';
  panel.innerHTML='<div class="resultsWrap"><div class="headlineBand">'+headline+'<p>'+esc(FRAMING)+'</p></div><article class="sheet"><p class="route">'+esc(originPlace(keys))+' \u2192 '+esc(floridaPlace(area))+'</p><p>Household: '+esc(householdLabel())+'.</p><p>'+esc(A.income==='not-sure'?'Income: not sure.':'Income: '+(band?band.label:'')+'. '+midpointCopy(band))+'</p><p>'+esc(filing)+'</p>'+evNote+'<div class="tableWrap" id="compareTable"><table class="compare"><caption class="sr">Monthly cost comparison. A positive difference costs more in Florida.</caption><thead>'+head+'</thead><tbody>'+body+'</tbody></table></div><div class="cards" id="compareCards">'+cards+'</div><p class="note">A positive difference means that line costs more in Florida.</p>'+total+notes+sourceBlock+'<p class="credit">Source: U.S. Bureau of Economic Analysis, Regional Price Parities 2024.</p>'+censusCredit()+'<div class="stepBar"><button type="button" class="secondary" id="backBtn">Back</button></div></article><section class="ctaBand"><img class="ctaLogo" src="logo_h_white.png" alt="Florida Gulf Coast Guide"><p>'+esc(REPORT)+'</p>'+bookingLink()+'</section></div>';
  document.getElementById('backBtn').onclick=()=>go('other');
  layoutResults();
}
function layoutResults(){
  const mobile=window.matchMedia('(max-width: 799px)').matches;
  const table=document.getElementById('compareTable');
  const cards=document.getElementById('compareCards');
  if(table) table.hidden=mobile;
  if(cards) cards.hidden=!mobile;
}
window.addEventListener('resize',layoutResults);
window.addEventListener('popstate',()=>{
  const step=(location.hash||'#from').replace('#','');
  render(STEPS.includes(step)?step:'from');
});
Promise.all([
  fetch('cost-of-living.json').then(r=>{if(!r.ok) throw new Error('bundle');return r.json()}),
  fetch('factors.json').then(r=>{if(!r.ok) throw new Error('factors');return r.json()})
]).then(function(loaded){
  bundle=loaded[0];
  factors=loaded[1];
  if(!bundle.crosswalk.zips) bundle.crosswalk.zips=[];
  const step=(location.hash||'#from').replace('#','');
  render(STEPS.includes(step)?step:'from');
}).catch(()=>{
  panel.innerHTML='<article class="sheet"><h2>The comparison could not load</h2><p>Refresh the page.</p></article>';
});
</script>
</body>
</html>
