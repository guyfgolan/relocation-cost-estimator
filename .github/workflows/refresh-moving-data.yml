# Moving estimator only. This writes data.json and does not touch cost-of-living/.
# No monthly workflow was in the repo, so this daily job is the only refresh.
name: Refresh moving estimator data

on:
  schedule:
    - cron: '15 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-moving-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - id: pull
        run: node scripts/refresh-moving-data.js
        continue-on-error: true

      - name: Commit and push data.json
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data.json
          if git diff --cached --quiet; then
            echo "No data.json changes."
          else
            git commit -m "Refresh moving estimator data"
            git push
          fi

      - name: Fail the run when a source failed
        if: steps.pull.outcome == 'failure'
        run: |
          echo "A source failed. data.json still has the last good value for that source."
          exit 1
