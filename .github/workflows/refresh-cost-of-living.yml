name: Refresh cost of living data

# Once a day. GitHub runs scheduled workflows from the default branch.
# There is no separate moving-estimator refresh; that data is not in this job.
on:
  schedule:
    - cron: '15 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-cost-of-living
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pull fresh cost-of-living figures
        id: refresh
        run: node cost-of-living/refresh.js
        continue-on-error: true
      - name: Commit updated data
        if: always() && steps.refresh.outcome != 'cancelled'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cost-of-living/factors.json cost-of-living/cost-of-living.json
          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "Refresh cost of living data"
            git push
          fi
      - name: Fail if a source could not be fetched
        if: steps.refresh.outcome == 'failure'
        run: |
          echo "A cost-of-living source could not be fetched. Last good values were kept and bad data was not written."
          exit 1
