y:flex;align-items:center;line-height:1.35}.resultBottom{display:grid;grid-template-columns:1.15fr .85fr;gap:34px;align-items:end;margin-top:24px;padding-top:22px;border-top:1px solid rgba(255,255,255,.22)}.summary dl{display:grid;grid-template-columns:max-content minmax(110px,1fr) max-content minmax(70px,.55fr);gap:8px 14px;margin:12px 0 0}.summary dt{color:#f1d79f;font-weight:700}.summary dd{margin:0}.closing{font-family:Georgia,'Times New Roman',serif;font-size:clamp(18px,2.2vw,22px);line-height:1.42;margin:22px 0 0;color:#fff}.bottomActions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px;align-items:center}.resultIdentity{display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-end;align-self:end}.resultIdentity .byline,.resultIdentity .contactSig{text-align:center;width:100%}.resultPhoto{width:100%;max-width:245px;border-radius:18px;aspect-ratio:4/5;object-fit:cover;object-position:center 16%;border:2px solid rgba(199,162,90,.65)}.resultIdentity .byline{text-align:left;font-size:24px;line-height:1.15;margin-top:12px;font-family:Georgia,'Times New Roman',serif}@media(min-width:721px){.resultBottom{grid-template-columns:minmax(0,1.35fr) minmax(0,.65fr);gap:28px}.resultIdentity{align-items:center}.resultIdentity .byline,.resultIdentity .contactSig{text-align:center}.resultLeft .summary,.resultLeft .closing{width:100%;max-width:100%;box-sizing:border-box}.resultLeft .closing{margin:18px 0 0;line-height:1.42}.resultLeft .bottomActions{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,3fr);gap:10px;width:100%;margin-top:16px;box-sizing:border-box;align-items:stretch}.resultLeft .bottomActions button{min-height:48px}.resultLeft .bottomActions .primary{grid-column:1/-1;width:100%;box-sizing:border-box}.resultLeft .bottomActions .secondary{width:100%;min-width:0;box-sizing:border-box}.resultLeft .bottomActions .secondary:nth-child(2){grid-column:1}.resultLeft .bottomActions .secondary:nth-child(3){grid-column:2}}.emailBox{display:none;margin-top:14px}.emailBox.show{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%}.emailBox input{width:min(100%,420px);min-width:0;padding:13px;border-radius:12px;border:0;text-align:left}.emailBox .primary{width:min(100%,420px)}.status{font-size:13px;margin-top:8px;color:#f1d79f;text-align:center;width:100%}.neutralMessage{max-width:680px}.neutralMessage p{font-size:clamp(18px,2.3vw,21px)}@media(max-width:720px){.resultLeft{width:100%;min-width:0}.resultLeft .summary,.resultLeft .closing,.resultLeft .bottomActions{width:100%;max-width:100%;box-sizing:border-box}.resultLeft .bottomActions{display:grid;grid-template-columns:minmax(0,1fr)}.resultLeft .bottomActions button{width:100%;min-width:0;box-sizing:border-box}.hero,.resultTop,.resultBottom{grid-template-columns:1fr}.hero{gap:22px;text-align:center}.heroMain{align-items:center;text-align:center}.heroMain h1{max-width:100%;font-size:clamp(34px,9vw,46px);line-height:1.08;text-wrap:balance}.heroStart{width:min(270px,78vw);max-width:270px;margin-inline:auto;box-sizing:border-box}.heroMedia{align-items:center;width:100%}.portrait{display:block;width:min(270px,78vw);max-width:270px;justify-self:center;margin-inline:auto;box-sizing:border-box}.portrait,.resultPhoto{justify-self:center;margin-inline:auto}.panel{border-radius:20px}.logo{width:176px}.topExp{width:82px}.summary dl{grid-template-columns:max-content 1fr}.bottomActions{display:grid}.bottomActions button{width:100%}.resultLead{grid-column:auto}.resultIdentity{align-items:center;width:100%;text-align:center}.resultIdentity .resultPhoto{display:block;margin-inline:auto}.resultIdentity .byline,.resultIdentity .contactSig{text-align:center!important;width:100%}.resultIdentity .byline{margin-left:auto;margin-right:auto}.resultIdentity .contactSig{margin-left:auto;margin-right:auto}}

</style></head><body><div class="app"><div class="bg" id="bg"></div><div class="shell"><header class="topbar"><img class="logo" id="brandLogo" src="assets/fgcg-logo-white.svg" alt="Florida Gulf Coast Guide"><img class="topExp" id="topExp" src="https://expknowledgebase.exprealty.com/hs-fs/hubfs/eXp%20Realty%20-%20White.png?height=48&amp;name=eXp+Realty+-+White.png" alt="eXp Realty"><div class="progressWrap" id="progressWrap" hidden><div class="progressText" id="progressText"></div><div class="progress"><div id="progressBar"></div></div></div></header><main class="main"><section class="panel" id="panel"></section></main></div></div><script>
const BOOK_URL='https://calendar.app.google/5xtMmGSY9kCY5NRk7';
const IMG={intro:'assets/gulf-beach.jpg',from:'assets/tampa.jpg',to:'assets/sarasota.jpg',when:'assets/gulf-beach.jpg',home:'assets/home.png',help:'assets/community-golf.jpg',dist:'assets/preserve.jpg',result:'assets/sarasota.jpg'};
const STEP_IMG={fromMethod:'from',fromState:'from',fromCity:'from',fromZip:'from',to:'to',when:'when',type:'home',size:'home',help:'help',packing:'help',veh:'from',vehHow:'dist',travel:'dist',storage:'home'};
let D=null,P=null,Z=null,A={},stack=[];
const panel=document.getElementById('panel'),bg=document.getElementById('bg'),pw=document.getElementById('progressWrap'),pt=document.getElementById('progressText'),pb=document.getElementById('progressBar');
function track(n,p={}){if(typeof window.gtag==='function')window.gtag('event',n,p)}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function setBg(k){bg.style.backgroundImage=`url("${IMG[k]||IMG.intro}")`}
function show(){if(!stack.length){intro();return}const step=stack[stack.length-1];if(step==='result')result();else renderStep(step)}
function go(step){stack.push(step);show()}
function back(){stack.pop();show()}
function restart(){A={};stack=[];show()}
function flow(){
 const s=['fromMethod'];
 if(A.fromMethod==='Enter ZIP code')s.push('fromZip');
 else if(A.fromMethod==='Choose state'){s.push('fromState');if(A.state!=='Not sure')s.push('fromCity')}
 s.push('to','when','type','size','help','packing','veh');
 if(A.veh&&A.veh!=='0')s.push('vehHow');
 s.push('travel','storage');
 return s;
}
function chrome(step){const f=flow();let i=f.indexOf(step);if(i<0)i=0;setBg(STEP_IMG[step]||'from');brandLogo.hidden=true;topExp.hidden=true;document.querySelector('.topbar').classList.remove('resultMode');pw.hidden=false;pt.textContent=`${i+1} of ${f.length}`;pb.style.width=`${(i+1)/f.length*100}%`;panel.className='panel';return i+1}
function intro(){pw.hidden=true;document.querySelector('.topbar').classList.remove('resultMode');brandLogo.hidden=false;topExp.hidden=false;setBg('intro');panel.className='panel';panel.innerHTML=`<div class="hero"><div class="heroMain"><div class="eyebrow">Moving Cost Estimator</div><h1>What Will Your Move to the Gulf Coast Cost?</h1><p>The cost of moving your belongings, and of getting you and your vehicles there.</p><button type="button" class="primary heroStart" onclick="go('fromMethod')">Get Started</button></div><div class="heroMedia"><img class="portrait" src="assets/guy-portrait.jpg" alt="Guy Golan"><div class="byline">Guy Golan</div></div></div>`}
function bars(opts,fn){return `<div class="options${opts.length>4?' two':''}">${opts.map(o=>`<button type="button" class="option" onclick="${fn}('${esc(o).replace(/'/g,'&#39;')}')">${esc(o)}</button>`).join('')}</div>`}
function renderStep(step){
 const n=chrome(step);
 const head=(title,hint)=>`<div class="questionNo">Your move · Question ${n}</div><h2>${title}</h2>${hint?`<p class="hint">${hint}</p>`:''}`;
 const backBtn=`<div class="actions"><button type="button" class="back" onclick="back()">← Back</button></div>`;
 if(step==='fromMethod'){
  panel.innerHTML=head('Where are you moving from?','Choose a state and city, or type a ZIP code.')+`<div class="options"><button type="button" class="option" onclick="chooseMethod('Choose state')">Choose state</button><button type="button" class="option" onclick="chooseMethod('Enter ZIP code')">Enter ZIP code</button><button type="button" class="option" onclick="chooseMethod('Not sure')">Not sure</button></div>`+backBtn;
 }else if(step==='fromState'){
  const names=Object.keys(P.states),sel=P.states[A.state]?A.state:'';
  panel.innerHTML=head('Which state are you moving from?','Tap a state, then continue. Tap it again to clear it.')+`<div class="options"><button type="button" class="option" onclick="stateUnsure()">Not sure</button></div><div class="statePanel"><div class="options two">${names.map(name=>`<button type="button" class="option${name===sel?' selected':''}" data-name="${esc(name)}" aria-pressed="${name===sel}" onclick="toggleState(this)">${esc(name)}</button>`).join('')}</div></div><div class="actions"><button type="button" class="primary" id="stateContinue" onclick="continueState()"${sel?'':' disabled'}>Continue</button><button type="button" class="back" onclick="back()">← Back</button></div>`;
 }else if(step==='fromCity'){
  const cities=(P.states[A.state]||{}).cities||[];
  panel.innerHTML=head(`Which city in ${esc(A.state)}?`,'Largest incorporated places, biggest first. No neighborhoods. If yours is missing, enter a ZIP.')+`<div class="options"><button type="button" class="option" onclick="cityUnsure()">Not sure</button></div><div class="statePanel"><div class="options two">${cities.map((c,i)=>`<button type="button" class="option" onclick="chooseCity(${i})">${esc(c[0])}</button>`).join('')}</div></div><div class="actions"><button type="button" class="back" onclick="cityToZip()">City not listed? Enter a ZIP</button><button type="button" class="back" onclick="back()">← Back</button></div>`;
 }else if(step==='fromZip'){
  panel.innerHTML=head('What is the ZIP code you are moving from?','Five digits. The point used is the Census ZIP Code Tabulation Area center, which is close to the ZIP code but not the post office.')+`<div class="zipRow"><input id="zip" inputmode="numeric" autocomplete="postal-code" maxlength="10" placeholder="ZIP code" value="${esc(A.zip||'')}"><button type="button" class="primary" onclick="submitZip()">Continue</button><p class="status" id="zipStatus"></p></div>`+backBtn;
  const input=document.getElementById('zip');input.focus();input.addEventListener('keydown',e=>{if(e.key==='Enter')submitZip()});
 }else if(step==='to'){
  panel.innerHTML=head('Which Gulf Coast area are you moving to?')+`<div class="options two">${D.areas.map(a=>`<button type="button" class="option" onclick="chooseTo('${a.id}')">${esc(a.name)}</button>`).join('')}<button type="button" class="option" onclick="chooseTo('unsure')">Not sure</button></div>`+backBtn;
 }else if(step==='when'){
  panel.innerHTML=head('When is the move?')+bars(months().concat(['Not sure']),'chooseWhen')+backBtn;
 }else if(step==='type'){
  panel.innerHTML=head('What kind of home are you moving?')+bars(['Studio apartment','Apartment','Condo','Townhome','Single-story house','Multi-story house','Not sure'],'chooseType')+backBtn;
 }else if(step==='size'){
  panel.innerHTML=head('How many bedrooms?')+bars(['1 bedroom','2 bedrooms','3 bedrooms','4 bedrooms','5+ bedrooms','Not sure'],'chooseSize')+backBtn;
 }else if(step==='help'){
  panel.innerHTML=head('How much help do you want with the move?')+bars(['DIY rental truck','Moving container','Full-service movers','Not sure'],'chooseHelp')+backBtn;
 }else if(step==='packing'){
  panel.innerHTML=head('How much packing do you want?')+bars(['None','Partial','Full','Not sure'],'choosePacking')+backBtn;
 }else if(step==='veh'){
  panel.innerHTML=head('How many vehicles are you bringing?')+bars(['0','1','2','3+','Not sure'],'chooseVeh')+backBtn;
 }else if(step==='vehHow'){
  panel.innerHTML=head('How will the vehicles get there?')+bars(['Drive them','Ship them','Not sure'],'chooseVehHow')+backBtn;
 }else if(step==='travel'){
  panel.innerHTML=head('How will you travel?')+bars(['Driving','Flying','Not sure'],'chooseTravel')+backBtn;
 }else if(step==='storage'){
  panel.innerHTML=head('Will you need temporary storage?')+bars(['No','Yes','Not sure'],'chooseStorage')+backBtn;
 }
}
function chooseMethod(v){A.fromMethod=v;if(v!=='Choose state'){A.state=null;A.city=null}if(v!=='Enter ZIP code')A.zip=null;if(v==='Not sure'){A.origin=null;A.state=null;A.city=null;A.zip=null;go('to');return}go(v==='Choose state'?'fromState':'fromZip')}
function toggleState(btn){const name=btn.getAttribute('data-name');A.state=A.state===name?'':name;A.city=null;A.origin=null;document.querySelectorAll('.statePanel .option').forEach(b=>{const on=b.getAttribute('data-name')===A.state;b.classList.toggle('selected',on);b.setAttribute('aria-pressed',on?'true':'false')});document.getElementById('stateContinue').disabled=!A.state}
function continueState(){if(!P.states[A.state])return;go('fromCity')}
function stateUnsure(){A.state='Not sure';A.city=null;A.zip=null;A.origin=null;go('to')}
function chooseCity(i){const c=P.states[A.state].cities[i];A.city=c[0];A.zip=null;A.origin={lat:c[1],lon:c[2],state:A.state,label:`${c[0]}, ${A.state}`,via:'city'};go('to')}
function cityUnsure(){const st=P.states[A.state];A.city=null;A.zip=null;A.origin={lat:st.lat,lon:st.lon,state:A.state,label:`${A.state} (state center)`,via:'state-point'};go('to')}
function cityToZip(){A.fromMethod='Enter ZIP code';A.city=null;A.origin=null;stack=['fromMethod','fromZip'];show()}
function submitZip(){const zip=(document.getElementById('zip').value.match(/\d/g)||[]).join('').slice(0,5);const rec=Z.z[zip];const status=document.getElementById('zipStatus');if(!rec){status.textContent='That ZIP is not in the Census ZCTA list this estimator uses. Try another, or go back and choose a state.';return}const state=Z.usps[rec[2]];A.zip=zip;A.state=state;A.city=null;A.origin={lat:rec[0],lon:rec[1],state,label:`ZIP ${zip}, ${state}`,via:'zip'};go('to')}
function chooseTo(id){if(id==='unsure'){A.area='Not sure';A.dest=null}else{A.dest=D.areas.find(a=>a.id===id);A.area=A.dest.name}go('when')}
function months(){const out=[],d=new Date();d.setDate(1);for(let i=0;i<12;i++){out.push(d.toLocaleString('en-US',{month:'long',year:'numeric'}));d.setMonth(d.getMonth()+1)}return out}
function chooseWhen(v){A.when=v;go('type')}
function chooseType(v){A.type=v;go('size')}
function chooseSize(v){A.size=v;go('help')}
function chooseHelp(v){A.help=v;go('packing')}
function choosePacking(v){A.packing=v;go('veh')}
function chooseVeh(v){A.veh=v;if(v==='0')A.vehHow=null;go(v==='0'?'travel':'vehHow')}
function chooseVehHow(v){A.vehHow=v;go('travel')}
function chooseTravel(v){A.travel=v;go('storage')}
function chooseStorage(v){A.storage=v;go('result')}
function helpKey(){if(A.help==='DIY rental truck')return 'truck';if(A.help==='Moving container')return 'container';return 'full'}
function vehN(){if(A.veh==='1'||A.veh==='2')return +A.veh;if(A.veh==='3+')return 3;if(A.veh==='0')return 0;return null}
function summer(){return /^(June|July|August|September)\b/.test(A.when||'')}
function roadMiles(){if(!A.origin||!A.dest)return null;const R=3958.7613,a=A.origin,b=A.dest;const p1=a.lat*Math.PI/180,p2=b.lat*Math.PI/180,dp=(b.lat-a.lat)*Math.PI/180,dl=(b.lon-a.lon)*Math.PI/180;const h=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;const gc=2*R*Math.asin(Math.sqrt(h));return {gc,road:gc*D.distance.factor}}
function line(label,lo,hi,src,src2,note){return {label,lo,hi,src,src2,note:note||''}}
function hahPick(){const rows=D.hah.value.rows;const beds={'1 bedroom':1,'2 bedrooms':2,'3 bedrooms':3,'4 bedrooms':4,'5+ bedrooms':5}[A.size];const studio=A.type==='Studio apartment',house=A.type==='Single-story house'||A.type==='Multi-story house',town=A.type==='Townhome';const notes=[];let b=beds;if(b==null){b=studio?1:2;notes.push(studio?'Home size not chosen: the studio uses the smallest published row.':'Home size not chosen: a 2-bedroom row is shown.')}if(!A.type||A.type==='Not sure')notes.push('Property type not chosen: apartment rows are used.');let idx;if(studio&&b<=1){idx=0;notes.push('Studio is not its own HireAHelper row; the smallest published row is used.')}else if(house||town){if(b<=1){idx=2;notes.push('A 1-bedroom house is not its own row; the 2-bedroom house row is used.')}else if(b===2)idx=2;else if(b===3)idx=3;else if(b===4)idx=4;else idx=5;if(house)notes.push('Number of stories is not priced separately in the cited table.')}else{if(b<=1)idx=0;else if(b===2)idx=1;else if(b===3)idx=2;else if(b===4){idx=3;notes.push('A 4-bedroom apartment is not its own row; the 3-bedroom house / large townhome row is used.')}else{idx=4;notes.push('A 5+ bedroom apartment is not its own row; the 4-bedroom house row is used.')}}return {idx,row:rows[idx],note:notes.join(' ')}}
function cmrSize(){if(A.type==='Studio apartment'&&(!A.size||A.size==='Not sure'||A.size==='1 bedroom'))return {i:0,note:''};if(A.size==='1 bedroom')return {i:0,note:''};if(A.size==='3 bedrooms')return {i:2,note:''};if(A.size==='4 bedrooms')return {i:3,note:''};if(A.size==='5+ bedrooms')return {i:3,note:'5+ bedrooms uses the published 4+ bedroom cell.'};return {i:1,note:(!A.size||A.size==='Not sure')?'Home size not chosen: the 2-bedroom cell is shown.':''}}
function seasonNote(){const s=D.cmrSeason.value;return `Peak-season adjustment is not applied. CMR's 2-bedroom median was $${s.jul.toLocaleString('en-US')} in July and $${s.jan.toLocaleString('en-US')} in January.`}
function moverLine(dist){const key=helpKey();const names={truck:'DIY rental truck',container:'Moving container',full:'Full-service movers'};const helpNote=(!A.help||A.help==='Not sure')?'Help level not chosen: full-service prices are shown.':'';if(!dist)return line(names[key],null,null,D.unsourced.mpg&&{value:null,label:'Mover price needs a distance',source:'Origin or destination was not specific enough to choose a mileage band',url:null,status:'UNSOURCED'},null,'Without both places, the mileage band cannot be chosen, so this line is excluded.');const road=dist.road;if(key!=='full'||road<100){const table=road<100?D.hah.value.local:D.hah.value.ld1200;const pick=hahPick();const v=table[key][pick.idx];let note=pick.note;if(road<50)note=(note?note+' ':'')+'Priced from HireAHelper’s local table, which is published for moves under 50 miles.';else if(road<100)note=(note?note+' ':'')+'HireAHelper’s local table is published for moves under 50 miles. At about this distance it is the closest published price and may be low.';else note=(note?note+' ':'')+(D.hah.caveat||'');if(helpNote)note=(helpNote+' '+note).trim();if(summer())note=(note?note+' ':'')+seasonNote();return line(`${names[key]} — ${pick.row}`,v,v,D.hah,summer()?D.cmrSeason:null,note)}const b=road<500?0:road<1000?1:road<1500?2:road<2000?3:4;const sz=cmrSize();const mv=D.movers.value;const lo=mv.low[b][sz.i],md=mv.median[b][sz.i],hi=mv.high[b][sz.i];let note=`${mv.bands[b].replace('-','–')} miles, ${mv.sizes[sz.i]}. Median $${md.toLocaleString('en-US')}. Estimated road distance ${Math.round(road).toLocaleString('en-US')} miles.`;if(sz.note)note+=' '+sz.note;if(mv.sample[b][sz.i])note+=` CMR marked this cell: ${mv.sample[b][sz.i]}.`;if(helpNote)note=helpNote+' '+note;if(summer())note+=' '+seasonNote();return line('Full-service movers',lo,hi,D.movers,summer()?D.cmrSeason:null,note)}
function estimate(){const dist=roadMiles();const lines=[moverLine(dist)];if(A.packing==='None')lines.push(line('Packing',0,0,null,null,'No packing service selected.'));else lines.push(line('Packing'+(A.packing&&A.packing!=='Not sure'?': '+A.packing:''),null,null,D.unsourced.packing,null,'Partial and full packing prices are not sourced, so they are excluded.'));const n=vehN();const driving=A.vehHow==='Drive them'||A.travel==='Driving';const maybeDrive=A.vehHow==='Not sure'||A.travel==='Not sure';const shipping=A.vehHow==='Ship them'||(A.vehHow==='Not sure'&&A.veh!=='0');if(driving||(maybeDrive&&A.travel!=='Flying'&&A.vehHow!=='Ship them')){const miles=dist?` Estimated road distance ${Math.round(dist.road).toLocaleString('en-US')} miles. Florida regular gasoline is $${D.gas.value}/gal.`:'';lines.push(line('Fuel for the drive',null,null,D.unsourced.mpg,D.gas,'Vehicle MPG is not sourced, so fuel is excluded.'+miles))}if(shipping)lines.push(line('Vehicle shipping'+(n?` × ${n}`:''),null,null,D.unsourced.ship,null,A.veh==='3+'?'3+ vehicles counted as 3. Auto-transport prices are not sourced.':'Auto-transport prices are not sourced.'));if(A.travel==='Driving'||A.travel==='Not sure')lines.push(line('Lodging on the drive',null,null,D.unsourced.milesPerDay,D.lodging,'The nightly lodging proxy is sourced. Nights on the road are not, so lodging is excluded.'));if(A.travel==='Flying'||A.travel==='Not sure')lines.push(line('Airfare',null,null,D.unsourced.airfare,null,'Airfare is not sourced.'));if(A.storage==='No')lines.push(line('Temporary storage',0,0,null,null,'No storage selected.'));else lines.push(line('Temporary storage',null,null,D.unsourced.storage,null,'Storage prices are not sourced.'));const inFL=A.origin&&A.origin.state==='Florida';if(n>0&&A.origin&&!inFL){for(const key of ['initReg','title','plate','regTax']){const fee=D.fl[key];const each=Math.round(fee.value);lines.push(line(`${fee.label}${n>1?` × ${n}`:''}`,each*n,each*n,fee,null,A.veh==='3+'?'3+ vehicles counted as 3.':''))}}else if(A.veh&&A.veh!=='0'&&!inFL)lines.push(line('Florida new-resident vehicle fees',null,null,{value:null,label:'Florida new-resident vehicle fees',source:'The fee schedule is published, but the vehicle count or the origin state was not chosen',url:D.fl.initReg.url,asOf:D.fl.initReg.asOf,status:'UNSOURCED'},null,'Registration, title, and plate fees are added only when a non-Florida origin and a vehicle count are both known.'));let lo=0,hi=0,priced=false,miss=0;for(const L of lines){if(L.lo==null){miss++;continue}const a=Math.round(L.lo),b=Math.round(L.hi);if(a||b)priced=true;lo+=a;hi+=b}if(!priced){lo=null;hi=null}return {lines,dist,lo,hi,miss,inFL}}
function money(v){return '$'+Math.round(v).toLocaleString('en-US')}
function rangeText(lo,hi){if(lo==null)return '<span class="flag">UNSOURCED</span>';const a=Math.round(lo),b=Math.round(hi);return a===b?money(a):`${money(a)}–${money(b)}`}
function cite(o){if(!o)return '';const f=o.status==='UNSOURCED'?'<span class="flag">UNSOURCED</span> ':o.status==='ASSUMPTION'?'<span class="flag a">ASSUMPTION</span> ':'';return f+(o.url?`<a href="${esc(o.url)}" target="_blank" rel="noopener">${esc(o.source||'')}</a>`:esc(o.source||''))+(o.asOf?' · '+esc(o.asOf):'')+(o.checked?' · checked '+esc(o.checked):'')+(o.caveat?`<br>${esc(o.caveat)}`:'')}
function result(){track('estimator_complete');pw.hidden=true;document.querySelector('.topbar').classList.add('resultMode');brandLogo.hidden=false;topExp.hidden=false;setBg('result');panel.className='panel wide';const e=estimate();window._est=e;const where=A.dest?A.dest.name:'the Gulf Coast';const total=e.lo==null?'—':rangeText(e.lo,e.hi);let miles='Road distance was not estimated, so mileage-based mover prices are excluded.';if(e.dist){const road=Math.round(e.dist.road),gc=Math.round(e.dist.gc);miles=`About ${road.toLocaleString('en-US')} estimated road miles from ${esc(A.origin.label)} to ${esc(A.dest.name)} (great-circle ${gc.toLocaleString('en-US')} × ${D.distance.factor}).`;if(A.origin.via==='zip')miles+=' Origin is the Census ZCTA center for that ZIP.';if(A.origin.via==='state-point')miles+=' City was not chosen, so the state internal point is the origin.';if(e.inFL)miles+=' Florida new-resident vehicle fees are not included because the move starts in Florida.'}panel.innerHTML=`<div class="eyebrow">Your moving cost estimate</div><h2>Your move to ${esc(where)}</h2><p>${miles}</p><div class="big two"><div><small>One-time total, sourced lines</small><strong>${total}</strong><div class="src">${e.lo==null?'No sourced charge to add yet.':'Low to high where the cited table publishes both. Otherwise the published amount.'}</div></div><div><small>Estimated road miles</small><strong>${e.dist?Math.round(e.dist.road).toLocaleString('en-US'):'—'}</strong><div class="src">${esc(D.distance.caveat)}</div></div></div><p class="src"><span class="flag">UNSOURCED</span> ${e.miss} line${e.miss===1?'':'s'} excluded from the total. ${cite(D.distance)}</p><p class="src">${e.dist&&A.dest?esc(A.dest.point):''}${e.dist&&A.origin?` Origin: ${esc(A.origin.label)}.` :''}</p><h3>Breakdown</h3><div class="tableWrap"><table class="est"><tr><th>Item</th><th>Amount</th><th>Source</th></tr>${e.lines.map(l=>`<tr><td>${esc(l.label)}${l.note?`<div class="src">${esc(l.note)}</div>`:''}</td><td class="n">${rangeText(l.lo,l.hi)}</td><td class="src">${l.src?cite(l.src):esc(l.lo===0?'Chosen. No price to cite.':'')}${l.src2?'<br>'+cite(l.src2):''}</td></tr>`).join('')}</table></div><div class="actions"><button type="button" class="primary" onclick="track('booking_button_click');window.open(BOOK_URL,'_blank','noopener')">Book a Call with Guy</button><button type="button" class="secondary" onclick="emailMe()">Email Me My Results</button><button type="button" class="secondary" onclick="restart()">Retake</button></div><p class="src" id="status"></p><p class="src">Estimates only, not a quote. Amounts are the published figures cited above. Guy Golan, eXp Realty.</p>`}
function emailMe(){const e=window._est,email=prompt('Your email address');if(!email)return;const lines=e.lines.map(l=>`- ${l.label}: ${l.lo==null?'UNSOURCED, not included':rangeText(l.lo,l.hi).replace(/<[^>]+>/g,'')}`).join('\n');const body=`Your Gulf Coast moving cost estimate\n\nFrom: ${A.origin?A.origin.label:'not chosen'}\nTo: ${A.area||'not chosen'}\nWhen: ${A.when||''}\nHome: ${A.type||''} · ${A.size||''}\nHelp: ${A.help||''} · Packing: ${A.packing||''}\nVehicles: ${A.veh||''} ${A.vehHow||''}\nTravel: ${A.travel||''} · Storage: ${A.storage||''}\n\nSourced total: ${e.lo==null?'no sourced charge': (Math.round(e.lo)===Math.round(e.hi)?money(e.lo):money(e.lo)+'–'+money(e.hi))}\n${e.dist?'Estimated road miles: '+Math.round(e.dist.road):'Distance not estimated'}\n\n${lines}\n\nUNSOURCED lines are excluded. Estimates only, not a quote.\n\nGuy Golan\neXp Realty\n301-919-6726\nguy@floridagulfcoastguide.com`;track('email_results_draft_opened');window.location.href=`mailto:${encodeURIComponent(email)}?bcc=${encodeURIComponent('guy@floridagulfcoastguide.com')}&subject=${encodeURIComponent('Your Gulf Coast Moving Cost Estimate')}&body=${encodeURIComponent(body)}`;document.getElementById('status').textContent='Your email app should open with your results prepared.'}
Promise.all([fetch('data.json').then(r=>r.json()),fetch('places.json').then(r=>r.json()),fetch('zips.json').then(r=>r.json())]).then(([d,p,z])=>{D=d;P=p;Z=z;if(location.hash==='#demo'){const c=P.states.Ohio.cities.find(x=>x[0]==='Columbus');A={fromMethod:'Choose state',state:'Ohio',city:'Columbus',origin:{lat:c[1],lon:c[2],state:'Ohio',label:'Columbus, Ohio',via:'city'},dest:D.areas.find(a=>a.id==='venice'),area:'Venice',when:'March 2027',type:'Single-story house',size:'3 bedrooms',help:'Full-service movers',packing:'None',veh:'1',vehHow:'Drive them',travel:'Driving',storage:'No'};stack=['storage','result'];show()}else show()}).catch(()=>{panel.innerHTML='<h2>The estimator could not load its data.</h2><p>Refresh the page. If it keeps happening, the data files did not publish.</p>'});
</script></body></html>
