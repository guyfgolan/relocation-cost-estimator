</style></head><body><div class="app"><div class="bg" id="bg"></div><div class="shell"><header class="topbar"><img class="logo" id="brandLogo" src="assets/fgcg-logo-white.svg" alt="Florida Gulf Coast Guide"><img class="topExp" id="topExp" src="https://expknowledgebase.exprealty.com/hs-fs/hubfs/eXp%20Realty%20-%20White.png?height=48&amp;name=eXp+Realty+-+White.png" alt="eXp Realty"><div class="progressWrap" id="progressWrap" hidden><div class="progressText" id="progressText"></div><div class="progress"><div id="progressBar"></div></div></div></header><main class="main"><section class="panel" id="panel"></section></main></div></div><script>
const BOOK_URL='https://calendar.app.google/5xtMmGSY9kCY5NRk7';
const IMG={intro:'assets/gulf-beach.jpg',from:'assets/tampa.jpg',area:'assets/sarasota.jpg',dist:'assets/preserve.jpg',when:'assets/gulf-beach.jpg',home:'assets/home.png',help:'assets/community-golf.jpg',result:'assets/sarasota.jpg'};
let D=null,idx=-1,A={};const panel=document.getElementById('panel'),bg=document.getElementById('bg'),pw=document.getElementById('progressWrap'),pt=document.getElementById('progressText'),pb=document.getElementById('progressBar');
function track(n,p={}){if(typeof window.gtag==='function')window.gtag('event',n,p)}
function setBg(k){bg.style.backgroundImage=`url("${IMG[k]||IMG.intro}")`}
let Q=[];
function buildQ(){Q=[
{id:'from',title:'Where are you moving from?',img:'from',picker:true,specials:['Other / not listed','Already in Florida','Not sure']},
{id:'area',title:'Which Gulf Coast area are you moving to?',img:'area',two:true,opts:[...D.areas.map(a=>a.name),'Not sure']},
{id:'dist',title:'About how far is the move?',img:'dist',opts:['Under 100 miles','100–499 miles','500–999 miles','1,000–1,499 miles','1,500–1,999 miles','2,000+ miles','Not sure']},
{id:'when',title:'When are you planning to move?',img:'when',opts:['Summer (June–September)','Other months','Not sure']},
{id:'size',title:'How big is the home you are moving?',img:'home',opts:['Studio / 1 BR','2 BR','3 BR','4+ BR','Not sure']},
{id:'help',title:'How much help do you want with the move?',img:'help',opts:['DIY: rental truck + hired loaders','Moving container + hired loaders','Full-service movers','Not sure']},
{id:'tenure',title:'Will you rent or buy in Florida?',img:'home',opts:['Rent','Buy','Not sure']},
{id:'drivers',title:'How many adult drivers?',img:'from',opts:['1','2','3+','Not sure']},
{id:'veh',title:'How many vehicles are you bringing?',img:'from',opts:['0','1','2','3+','Not sure']},
{id:'vehHow',title:'How will the vehicles get there?',img:'dist',opts:['Drive them','Ship them','Not sure']},
{id:'temp',title:'Will you need temporary housing on arrival?',img:'home',opts:['None','About 1 week','About 2 weeks','About 1 month','Not sure']},
{id:'trips',title:'How many house-hunting trips before the move?',img:'area',opts:['0','1','2','3','Not sure']},
{id:'pets',title:'Are pets moving with you?',img:'dist',opts:['No pets','Yes','Not sure']},
{id:'storage',title:'Will you need storage?',img:'help',opts:['No','Yes','Not sure']},
{id:'flood',title:'Do you plan to carry flood insurance?',img:'when',opts:['Yes, likely high-risk zone','Yes, lower-risk zone','No','Not sure']}]}
function intro(){idx=-1;pw.hidden=true;document.querySelector('.topbar').classList.remove('resultMode');brandLogo.hidden=false;topExp.hidden=false;setBg('intro');panel.className='panel';panel.innerHTML=`<div class="hero"><div class="heroMain"><div class="eyebrow">Relocation Cost Estimator</div><h1>What Will Your Move to the Gulf Coast Cost?</h1><p>Answer ${Q.length} quick questions. One click each, no typing.</p><button class="primary heroStart" onclick="go(0)">Get Started</button><div class="proto">Local prototype · not published</div></div><div class="heroMedia"><img class="portrait" src="assets/guy-portrait.jpg" alt="Guy Golan"><div class="byline">Guy Golan</div></div></div>`}
function go(n){if(n===0&&idx===-1)track('estimator_start');idx=n;if(idx>=Q.length){result();return}renderQ()}
function stateNames(){return D.origins.map(o=>o.name).filter(n=>n!=='Other / not listed')}
function renderQ(){const q=Q[idx];setBg(q.img);brandLogo.hidden=true;topExp.hidden=true;pw.hidden=false;pt.textContent=`${idx+1} of ${Q.length}`;pb.style.width=`${(idx+1)/Q.length*100}%`;panel.className='panel';
 if(q.picker){renderFrom(q);return}
panel.innerHTML=`<div class="questionNo">Your move · Question ${idx+1}</div><h2>${q.title}</h2><div class="options ${q.two?'two':''}">${q.opts.map((o,i)=>`<button class="option" onclick="choose(${i})">${o}</button>`).join('')}</div><div class="actions"><button class="back" onclick="back()">← Back</button></div>`}
function renderFrom(q){const states=stateNames(),sel=states.includes(A.from)?A.from:'';
 panel.innerHTML=`<div class="questionNo">Your move · Question ${idx+1}</div><h2>${q.title}</h2><div class="options">${q.specials.map(o=>`<button class="option" onclick="chooseSpecial(this)">${o}</button>`).join('')}</div><div class="statePanel"><div class="options two">${states.map(o=>`<button type="button" class="option${o===sel?' selected':''}" aria-pressed="${o===sel}" onclick="toggleState(this)">${o}</button>`).join('')}</div></div><div class="actions"><button class="primary" id="fromContinue" onclick="continueFrom()"${sel?'':' disabled'}>Continue</button><button class="back" onclick="back()">← Back</button></div>`}
function chooseSpecial(btn){A.from=btn.textContent;track('estimator_answer',{question:'from',answer:A.from});go(idx+1)}
function toggleState(btn){const name=btn.textContent;A.from=A.from===name?'':name;document.querySelectorAll('.statePanel .option').forEach(b=>{const on=b.textContent===A.from;b.classList.toggle('selected',on);b.setAttribute('aria-pressed',on?'true':'false')});document.getElementById('fromContinue').disabled=!A.from}
function continueFrom(){if(!stateNames().includes(A.from))return;track('estimator_answer',{question:'from',answer:A.from});go(idx+1)}
function choose(i){const q=Q[idx];A[q.id]=q.opts[i];track('estimator_answer',{question:q.id,answer:q.opts[i]});go(idx+1)}
function back(){if(idx===0){intro();return}idx--;renderQ()}
const $=v=>v==null?'—':'$'+Math.round(v).toLocaleString();const NS='Not sure';
function cite(o){if(!o)return'';const f=o.status==='UNSOURCED'?'<span class="flag">UNSOURCED</span> ':o.status==='ASSUMPTION'?'<span class="flag a">ASSUMPTION</span> ':'';return f+(o.url?`<a href="${o.url}" target="_blank">${o.source}</a>`:o.source)+(o.asOf?' · '+o.asOf:'')+(o.checked?' · checked '+o.checked:'')+(o.caveat?`<br>${o.caveat}`:'')}
function sizeIdx(){return {'Studio / 1 BR':0,'2 BR':1,'3 BR':2,'4+ BR':3}[A.size]??1}
function moverCost(){const s=sizeIdx(),h=A.help||NS,hk=h.startsWith('DIY')?'truck':h.startsWith('Moving container')?'container':'full',hr=[0,1,3,4][s],notes=[];
 if(h===NS)notes.push('Help level not chosen: full-service shown.');if(A.size===NS)notes.push('Home size not chosen: 2 BR shown.');
 if(A.dist==='Under 100 miles'||A.from==='Already in Florida')return{v:D.hah.value.local[hk][hr],label:'Local move ('+hk+')',src:D.hah,notes};
 if(hk!=='full')return{v:D.hah.value.ld1200[hk][hr],label:'Long-distance '+(hk==='truck'?'truck + loaders':'container + loaders')+' (1,200-mi benchmark)',src:D.hah,notes};
 const b={'100–499 miles':0,'500–999 miles':1,'1,000–1,499 miles':2,'1,500–1,999 miles':3,'2,000+ miles':4}[A.dist];
 if(b==null){notes.push('Distance not chosen: all-distance median shown.');return{v:[2190,3320,5390,8830][s],label:'Full-service movers (all distances, median)',src:D.movers,notes}}
 let v=D.movers.value.median[b][s];if(v==null){notes.push('No CMR cell for this size/distance: HireAHelper 1,200-mi full-service used.');return{v:D.hah.value.ld1200.full[hr],label:'Full-service movers',src:D.hah,notes}}
 return{v,label:'Full-service movers ('+A.dist+')',src:D.movers,notes}}
function n(a,def=0){const x=parseInt(a);return isNaN(x)?def:x}
function areaObj(){return D.areas.find(a=>a.name===A.area)||D.areas[0]}
function oneTime(){const L=[],U=D.unsourced,F=D.fl,m=moverCost();
 L.push({label:m.label,v:m.v,src:m.src,note:m.notes.join(' ')+(A.when==='Summer (June–September)'?' CMR: July median ran about 25% above January (2BR $3,412 vs $2,728); not applied.':'')});
 const veh=A.veh==='3+'?3:n(A.veh,0),drv=A.drivers==='3+'?3:n(A.drivers,1);
 if(A.from!=='Already in Florida'){
  L.push({label:`FL driver license × ${drv}`,v:F.dl.value*drv,src:F.dl});
  if(veh){L.push({label:`FL initial registration fee × ${veh}`,v:F.initReg.value*veh,src:F.initReg});L.push({label:`FL title (used, electronic) × ${veh}`,v:F.title.value*veh,src:F.title});L.push({label:`FL license plate × ${veh}`,v:F.plate.value*veh,src:F.plate});L.push({label:`FL base vehicle tax (2,500–3,499 lb auto) × ${veh}`,v:F.regTax.value*veh,src:F.regTax})}}
 if(veh&&A.vehHow==='Ship them')L.push({label:'Vehicle shipping',v:null,src:U.ship});
 if(veh&&A.vehHow!=='Ship them'&&A.dist!=='Under 100 miles'){L.push({label:'Fuel for the drive (FL avg $'+D.gas.value+'/gal)',v:null,src:D.gas,note:'Needs vehicle MPG (unsourced) to compute.'});L.push({label:'Lodging on the drive',v:null,src:U.milesPerDay,note:'GSA $110/night proxy available; nights-per-mile is unsourced.'})}
 const tn={'About 1 week':7,'About 2 weeks':14,'About 1 month':30}[A.temp];if(tn)L.push({label:`Temporary housing, ${tn} nights × $${D.lodging.value}`,v:tn*D.lodging.value,src:D.lodging});
 const tr=n(A.trips,0);if(tr)L.push({label:`House-hunting trips: ${tr} × ${D.assumptions.tripNights.value} nights lodging`,v:tr*D.assumptions.tripNights.value*D.lodging.value,src:D.lodging,src2:D.assumptions.tripNights,note:'Lodging only; airfare/meals not included.'});
 L.push({label:'Utility & internet setup deposits',v:null,src:U.utilDeposit});
 if(A.tenure!=='Buy')L.push({label:'Rental security deposit & application fees',v:null,src:U.rentDeposit});
 if(A.storage==='Yes')L.push({label:'Storage',v:null,src:U.storage});
 if(A.pets==='Yes')L.push({label:'Pet relocation',v:null,src:U.pets});
 L.push({label:'Hurricane prep supplies',v:null,src:U.hurricane});return L}
function ongoing(){const a=areaObj(),f=D.fmr[a.fmr],ce=D.ce,I=D.ins,U=D.unsourced,L=[];const o=D.origins.find(x=>x.name===A.from),fl=D.elecSource.value;
 const beds=[1,2,3,4][sizeIdx()];
 if(A.tenure==='Buy')L.push({label:'Housing (owner costs)',fl:null,src:U.buyHousing});else L.push({label:`Housing: typical ${beds}BR rent, ${f.label.replace('HUD FMR ','')}`,fl:f.value[beds]*12,src:f});
 L.push({label:'Electricity',fl:ce.elec.value,org:o&&o.elecCents?ce.elec.value*o.elecCents/fl:null,src:ce.elec,src2:D.elecSource,note:o&&o.elecCents?`Origin = same usage × ${A.from} price ${o.elecCents}¢ vs FL ${fl}¢/kWh (EIA, July 2026).`:'No origin electricity price for this choice.'});
 L.push({label:'Water & public services',fl:ce.water.value,src:ce.water});
 L.push({label:'Cell phone service',fl:ce.cell.value,src:ce.cell});
 L.push({label:'Home internet',fl:null,src:U.internet});
 if(A.tenure==='Buy')L.push({label:'Homeowners insurance (FL statewide avg)',fl:I.ho.value,src:I.ho});else L.push({label:'Renters insurance',fl:null,src:I.renters});
 if(A.flood&&A.flood.startsWith('Yes'))L.push({label:'Flood insurance (NFIP FL avg)',fl:I.flood.value,src:I.flood,note:A.flood.includes('high')?'High-risk zones usually cost more than the statewide average; get a FloodSmart quote.':''});
 L.push({label:'Auto insurance',fl:null,src:I.auto});
 L.push({label:'Groceries (food at home)',fl:ce.food.value,src:ce.food});
 L.push({label:'Transportation (non-insurance)',fl:null,src:U.transport});
 L.push({label:'State income tax',fl:0,org:null,src:D.tax.fl,src2:D.tax.origin,note:A.from==='Already in Florida'?'':'Your origin-state tax is a likely saving but is not yet sourced.'});
 return L}
function rankAreas(){const b=[1,2,3,4][sizeIdx()];return D.areas.map(a=>({a,r:D.fmr[a.fmr].value[b],rpp:D.rpp.value[a.fmr]})).sort((x,y)=>x.r-y.r)}
function result(){track('estimator_complete');pw.hidden=true;document.querySelector('.topbar').classList.add('resultMode');brandLogo.hidden=false;topExp.hidden=false;setBg('result');panel.className='panel wide';
 const ot=oneTime(),og=ongoing(),otT=ot.reduce((s,l)=>s+(l.v||0),0),ogT=og.reduce((s,l)=>s+(l.fl||0),0),cmp=og.filter(l=>l.org!=null&&l.fl!=null),diff=cmp.reduce((s,l)=>s+(l.org-l.fl),0),miss=ot.filter(l=>l.v==null).length+og.filter(l=>l.fl==null).length;
 window._est={ot,og,otT,ogT,diff};const area=A.area&&A.area!==NS?A.area:'Southwest Florida';
 panel.innerHTML=`<div class="eyebrow">Your Results</div><h2>Your Move to ${area}</h2>
 <div class="big"><div><small>One-time move costs</small><strong>${$(otT)}</strong></div><div><small>First-year total (one-time + 12 mo)</small><strong>${$(otT+ogT)}</strong></div><div><small>Net annual difference vs ${A.from||'origin'}</small><strong>${cmp.length?(diff>=0?'Save ':'Spend ')+$(Math.abs(diff)):'—'}</strong><div class="src">Based on ${cmp.length} line(s) with origin data</div></div></div>
 <p class="src"><span class="flag">UNSOURCED</span> ${miss} line(s) have no sourced figure yet and are NOT included in the totals.</p>
 <h3>One-time move costs</h3><table class="est"><tr><th>Item</th><th>Amount</th><th>Source</th></tr>${ot.map(l=>`<tr><td>${l.label}${l.note?`<div class="src">${l.note}</div>`:''}</td><td class="n">${l.v==null?'<span class="flag">UNSOURCED</span>':$(l.v)}</td><td class="src">${cite(l.src)}${l.src2?'<br>'+cite(l.src2):''}</td></tr>`).join('')}</table>
 <h3>Ongoing costs: Florida vs ${A.from||'origin'}</h3><table class="est"><tr><th>Item</th><th>FL / mo</th><th>FL / yr</th><th>Origin / yr</th><th>Source</th></tr>${og.map(l=>`<tr><td>${l.label}${l.note?`<div class="src">${l.note}</div>`:''}</td><td class="n">${l.fl==null?'<span class="flag">UNSOURCED</span>':$(l.fl/12)}</td><td class="n">${l.fl==null?'':$(l.fl)}</td><td class="n">${l.org==null?'<span class="src">no data</span>':$(l.org)}</td><td class="src">${cite(l.src)}${l.src2?'<br>'+cite(l.src2):''}</td></tr>`).join('')}
 <tr><td><b>Total (sourced lines)</b></td><td class="n"><b>${$(ogT/12)}</b></td><td class="n"><b>${$(ogT)}</b></td><td></td><td class="src">Utilities, groceries, phone: BLS CE South-region household averages (not SWFL-specific).</td></tr></table>
 <h3>Gulf Coast areas ranked by typical rent (${[1,2,3,4][sizeIdx()]}BR)</h3><table class="est"><tr><th>#</th><th>Area</th><th>County</th><th>Rent / mo</th><th>Price level (US=100)</th></tr>${rankAreas().map((x,i)=>`<tr><td>${i+1}</td><td>${x.a.name}</td><td>${x.a.county}</td><td class="n">${$(x.r)}</td><td class="n">${x.rpp}</td></tr>`).join('')}</table>
 <p class="src">Rent: ${cite(D.fmr.NPBS)}. Price level: ${cite(D.rpp)}. Areas in the same metro share HUD/BEA values, so they tie.</p>
 <div class="actions"><button class="primary" onclick="track('booking_button_click');window.open(BOOK_URL,'_blank')">Book a Call with Guy</button><button class="secondary" onclick="emailMe()">Email Me My Results</button><button class="secondary" onclick="restart()">Retake</button></div><p class="src" id="status"></p>
 <p class="src">Estimates only, not a quote. Figures are averages from the sources cited, as of the dates shown. Guy Golan, eXp Realty. Local prototype, not published.</p>`}
function emailMe(){const e=window._est,email=prompt('Your email address');if(!email)return;const body=`Your Gulf Coast relocation estimate\n\nMoving from: ${A.from}\nMoving to: ${A.area}\nHome: ${A.size} · Help: ${A.help}\n\nOne-time move costs: ${$(e.otT)}\nFirst-year total: ${$(e.otT+e.ogT)}\n\nOne-time:\n${e.ot.map(l=>`- ${l.label}: ${l.v==null?'not yet estimated':$(l.v)}`).join('\n')}\n\nOngoing (FL, per year):\n${e.og.map(l=>`- ${l.label}: ${l.fl==null?'not yet estimated':$(l.fl)}`).join('\n')}\n\nDo not hesitate to contact me directly. I am happy to help!\n\nGuy Golan\neXp Realty\n301-919-6726\nguy@floridagulfcoastguide.com`;track('email_results_draft_opened');window.location.href=`mailto:${encodeURIComponent(email)}?bcc=${encodeURIComponent('guy@floridagulfcoastguide.com')}&subject=${encodeURIComponent('Your Gulf Coast Relocation Cost Estimate')}&body=${encodeURIComponent(body)}`;document.getElementById('status').textContent='Your email app should open with your results prepared.'}
