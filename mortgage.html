<style>
@font-face{font-family:Cinzel;src:url("assets/fonts/Cinzel-VF.ttf") format("truetype");font-weight:400 900;font-display:swap}
:root{--navy:#0d2235;--gold:#c7a25a;--cream:#f7f3eb;--ink:#15202b}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#0B1E3F;color:#fff;font-family:Arial,Helvetica,sans-serif}
button,input,select{font:inherit}
.skip{position:absolute;left:12px;top:-48px;background:var(--gold);color:var(--navy);padding:8px 12px;z-index:9;font-weight:700}
.skip:focus{top:8px}
.bg,.overlay{position:fixed;inset:0;width:100%;height:100%;min-height:100vh;min-height:100dvh}
.bg{z-index:0;background:#0B1E3F}
.bg picture{display:block;position:absolute;inset:0;width:100%;height:100%;min-height:100vh;min-height:100dvh}
.bg img{position:absolute;inset:0;width:100%;height:100%;min-height:100vh;min-height:100dvh;object-fit:cover}
.overlay{z-index:1;background:rgba(11,30,63,.45);pointer-events:none}
.shell{position:relative;z-index:2;min-height:100vh;display:flex;flex-direction:column;padding:18px 16px 32px}
.top{display:flex;flex-direction:column;align-items:center;gap:8px}
.logo{width:min(168px,46vw);height:auto}
.siteNav{display:flex;flex-wrap:wrap;gap:4px 16px;justify-content:center}
.siteNav a{color:#f7f3eb;min-height:44px;display:inline-flex;align-items:center}
.siteNav a[aria-current="page"]{font-weight:700;text-decoration:none;border-bottom:2px solid var(--gold)}
.progress{width:min(420px,100%);height:5px;background:rgba(255,255,255,.28);margin:8px auto 0}
.progress>div{height:100%;background:var(--gold);width:0}
.stepGold{margin:14px 0 0;color:#f7f3eb;letter-spacing:.12em;text-transform:uppercase;font-family:Cinzel,Georgia,serif;font-size:13px;text-align:center}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:16px 0 8px}
.card{width:min(640px,100%);background:var(--cream);color:var(--ink);border:2px solid var(--gold);padding:clamp(20px,4vw,36px);box-shadow:0 0 0 6px rgba(13,34,53,.35)}
h1,h2{font-family:Cinzel,Georgia,"Times New Roman",serif;font-weight:600;letter-spacing:.04em;text-transform:uppercase;line-height:1.2;margin:0 0 12px;color:var(--navy)}
h1{font-size:clamp(26px,4vw,40px)}
h2{font-size:clamp(22px,3.4vw,34px)}
h2::after{content:"";display:block;width:64px;height:2px;margin-top:12px;background:var(--gold)}
p{margin:0 0 12px;line-height:1.5}
label{font-weight:700;display:block;margin:0 0 6px}
.field{margin:0 0 14px}
input,select{width:100%;min-height:44px;padding:12px 14px;border:1px solid #8a8172;border-radius:2px;background:#fff;color:var(--ink);font-size:16px}
input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--navy);outline-offset:2px;box-shadow:0 0 0 2px var(--gold)}
.hint,.src{font-size:15px;line-height:1.45;color:#3d4a57}
.src a{color:#0d2235}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:18px}
.primary,.secondary{min-height:44px;padding:12px 18px;cursor:pointer;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.primary{background:var(--gold);color:var(--navy);border:1px solid var(--gold)}
.secondary{background:transparent;color:var(--navy);border:1px solid var(--navy)}
.secondary:disabled{opacity:.45;cursor:not-allowed}
.status{min-height:1.4em;font-weight:700;margin:8px 0 0}
.figures{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.figures div{border:1px solid var(--gold);padding:12px;text-align:center}
.figures small{display:block;font-family:Cinzel,Georgia,serif;letter-spacing:.08em;text-transform:uppercase;color:var(--navy)}
.figures strong{display:block;margin-top:6px;font-size:clamp(22px,4vw,32px);font-variant-numeric:tabular-nums}
.tableWrap{overflow-x:auto;max-width:100%}
.tableWrap:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
details.fold{margin:12px 0;border-top:1px solid #d9d0c2;padding-top:8px}
details.fold summary{cursor:pointer;font-weight:700;min-height:44px;display:flex;align-items:center}
details.fold p,details.fold li{font-size:15px;color:#3d4a57;margin:0 0 8px}
details.fold ul{margin:0;padding-left:1.2em}
table{width:100%;border-collapse:collapse}
th,td{padding:8px 6px;border-bottom:1px solid #d9d0c2;text-align:left;vertical-align:top}
th{font-family:Cinzel,Georgia,serif;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:720px){.card{box-shadow:0 0 0 5px rgba(13,34,53,.45)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important;scroll-behavior:auto !important}}
</style>

<div class="bg" id="bg"><picture id="bgPicture">
<source id="bgMobile" media="(max-width: 828px)" type="image/webp">

</picture></div>

<div class="shell">

<script src="data/mortgage_defaults.js"></script>
<script src="mortgage.js"></script>
<script>
const BOOK_URL='https://calendar.app.google/5xtMmGSY9kCY5NRk7';
const D=window.MORTGAGE_DEFAULTS;
const PHOTOS=['step1_beach','step2_shore','step3_pool','step4_model_exterior','step5_model_kitchen','step6_lake','step7_sunset_pavilion','step8_sunset_gulf'];
const STEPS=[
  {id:'price',photo:PHOTOS[0],title:'What is the home price?',key:'price'},
  {id:'down',photo:PHOTOS[1],title:'What is the down payment?'},
  {id:'rate',photo:PHOTOS[2],title:'What is the interest rate?'},
  {id:'place',photo:PHOTOS[3],title:'Which county or city?'},
  {id:'tax',photo:PHOTOS[4],title:'What is the yearly property tax?'},
  {id:'insurance',photo:PHOTOS[5],title:'What is the monthly insurance?'},
  {id:'hoa',photo:PHOTOS[6],title:'What is the monthly HOA?'},
  {id:'results',photo:PHOTOS[7],title:'Your monthly range'}
];
const state={
  price:'',downDollars:'',downPercent:'',rate:'',placeId:'',communityId:'',taxAnnual:'',insuranceMonthly:'',hoaMonthly:'',
  touched:{},rateMeta:{source:null,url:null,asOf:null,fromFred:false}
};
let step=0;
let error='';
const card=document.getElementById('card');
const live=document.getElementById('live');
function track(name,params){if(typeof window.gtag==='function')window.gtag('event',name,Object.assign({page_location:location.href,transport_type:'beacon',tool:'mortgage'},params||{}))}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function money(n){if(n==null||!Number.isFinite(n))return '—';return n.toLocaleString('en-US',{style:'currency',currency:'USD'})}
function sourceItem(label, group){
  if(!group||!group.source)return '';
  const when=group.asOf?' as of '+group.asOf:'';
  const text=label+': '+group.source+when+'.';
  const body=group.url?'<a href="'+esc(group.url)+'">'+esc(text)+'</a>':esc(text);
  return '<li>'+body+'</li>';
}
function place(){return Mortgage.placeById(D,state.placeId)}
function prefill(){
  if(!state.touched.price && D.price && typeof D.price.value==='number')state.price=String(D.price.value);
  if(!state.touched.downDollars && D.downPayment && typeof D.downPayment.dollars==='number')state.downDollars=String(D.downPayment.dollars);
  if(!state.touched.downPercent && D.downPayment && typeof D.downPayment.percent==='number')state.downPercent=String(D.downPayment.percent);
  if(!state.touched.rate && state.rate==='' && D.rate && typeof D.rate.value==='number')state.rate=String(D.rate.value);
  if(!state.touched.insurance){
    const county=Mortgage.countyInsurance(D,place());
    state.insuranceMonthly=county&&typeof county.annual==='number'?String(Mortgage.cents(county.annual/12)):'';
  }
  const here=place();
  if(!state.touched.tax){
    const price=Mortgage.num(state.price);
    const mill=here&&here.millage&&here.millage.value;
    state.taxAnnual=price!=null&&typeof mill==='number'?String(Mortgage.cents(price*mill/1000)):'';
  }
  if(!state.touched.hoa){
    const hoa=here&&here.hoa&&here.hoa.monthly;
    state.hoaMonthly=typeof hoa==='number'?String(hoa):'';
  }
  if(!state.rateMeta.source && D.rate)state.rateMeta={source:D.rate.source,url:D.rate.url,asOf:D.rate.asOf,fromFred:false};
}
function field(id,label,value,hint,attrs){
  return '<div class="field"><label for="'+id+'">'+label+'</label><input id="'+id+'" '+attrs+' value="'+esc(value)+'" aria-describedby="'+id+'Hint">'+
    '<p class="hint" id="'+id+'Hint">'+hint+'</p></div>';
}
const snapshot={};
function readInputs(){
  [['price','price','price'],['downDollars','downDollars','downDollars'],['downPercent','downPercent','downPercent'],['rate','rate','rate'],['tax','taxAnnual','tax'],['insurance','insuranceMonthly','insurance'],['hoa','hoaMonthly','hoa']].forEach(function(row){
    const el=document.getElementById(row[0]);
    if(!el)return;
    if(el.value!==snapshot[row[0]])state.touched[row[2]]=true;
    state[row[1]]=el.value;
  });
  const placeEl=document.getElementById('place');
  if(placeEl){
    const prev=state.placeId;
    state.placeId=placeEl.value;
    if(prev!==state.placeId){state.touched.tax=false;prefill()}
  }
  const communityEl=document.getElementById('community');
  if(communityEl)state.communityId=communityEl.value;
}
function currentInvalid(){
  const id=STEPS[step].id;
  const checks={price:['price'],down:['downDollars','downPercent'],rate:['rate'],tax:['tax'],insurance:['insurance'],hoa:['hoa']};
  const ids=checks[id]||[];
  for(let i=0;i<ids.length;i++){
    const el=document.getElementById(ids[i]);
    if(!el)continue;
    const raw=el.value.trim();
    if(raw==='' )continue;
    if(Mortgage.num(raw)==null || Mortgage.num(raw)<0)return 'Enter a number, or leave the field blank.';
    if(ids[i]==='downPercent' && Mortgage.num(raw)>100)return 'Enter a percent from 0 to 100.';
  }
  return '';
}
let photoToken=0;
function sourceList(){
  const here=place();
  const items=[
    sourceItem('Interest rate', state.rateMeta.source?state.rateMeta:D.rate),
    sourceItem('Loan term', D.term),
    sourceItem('Property tax', here&&here.millage),
    sourceItem('Insurance', Mortgage.countyInsurance(D, here)||D.insurance.range),
    sourceItem('HOA', Mortgage.communityById(D, state.communityId))
  ].filter(Boolean);
  return items.length?items.join(''):'<li>Published sources appear here when a figure has one.</li>';
}
const CAPS={price:100000000,downDollars:100000000,downPercent:100,rate:30,tax:1000000,insurance:50000,hoa:50000};
function gentleClamp(){
  const rules={
    price:[['price','price',CAPS.price,'home price']],
    down:[['downDollars','downDollars',CAPS.downDollars,'down payment'],['downPercent','downPercent',CAPS.downPercent,'percent']],
    rate:[['rate','rate',CAPS.rate,'interest rate']],
    tax:[['tax','taxAnnual',CAPS.tax,'property tax']],
    insurance:[['insurance','insuranceMonthly',CAPS.insurance,'insurance']],
    hoa:[['hoa','hoaMonthly',CAPS.hoa,'HOA']]
  };
  const list=rules[STEPS[step].id]||[];
  let message='';
  list.forEach(function(row){
    const el=document.getElementById(row[0]);
    if(!el)return;
    const n=Mortgage.num(el.value);
    if(n!=null&&n>row[2]){
      el.value=String(row[2]);
      state[row[1]]=String(row[2]);
      snapshot[row[0]]=el.value;
      message=row[0]==='downPercent'||row[0]==='rate'?'That '+row[3]+' was higher than this page allows, so it was set to '+row[2]+(row[0]==='rate'?'%.':'.'):'That '+row[3]+' was higher than this page allows, so it was set to '+money(row[2])+'.';
    }
  });
  return message;
}
function showPhoto(name){
  const token=++photoToken;
  const base='assets/mortgage/'+name;
  const mobile=window.matchMedia('(max-width: 828px)').matches;
  const previous=document.getElementById('bgPreload');
  if(previous)previous.remove();
  const preload=document.createElement('link');
  preload.id='bgPreload';
  preload.rel='preload';
  preload.as='image';
  preload.type='image/webp';
  preload.href=base+(mobile?'_mobile':'')+'.webp';
  document.head.appendChild(preload);
  document.getElementById('bgMobile').srcset=base+'_mobile.webp';
  document.getElementById('bgDesktop').srcset=base+'.webp';
  document.getElementById('bgJpgMobile').srcset=base+'_mobile.jpg';
  const photo=document.getElementById('bgPhoto');
  photo.hidden=true;
  photo.onload=function(){if(token===photoToken)photo.hidden=false};
  photo.onerror=function(){if(token===photoToken)photo.hidden=true};
  photo.src=base+'.jpg';
}
function show(index){
  if(index!=null)step=index;
  if(step<0)step=0;
  if(step>STEPS.length-1)step=STEPS.length-1;
  prefill();
  const item=STEPS[step];
  document.getElementById('progressBar').style.width=((step+1)/STEPS.length*100)+'%';
  document.getElementById('stepGold').textContent='Question '+(step+1)+' of '+STEPS.length;
  showPhoto(item.photo);
  const nextLabel=step===STEPS.length-2?'See the range':'Next';
  let body='';
  if(item.id==='price'){
    body=field('price','Home price, in dollars',state.price,'You can include a dollar sign or commas.','inputmode="decimal" autocomplete="off"');
  }else if(item.id==='down'){
    body=field('downDollars','Down payment, in dollars',state.downDollars,'Fill dollars or percent. If both are filled, the dollar amount is used.','inputmode="decimal" autocomplete="off"')+
      field('downPercent','Down payment, percent of the price',state.downPercent,'For example, 20 means 20 percent. Leave this blank if you used dollars.','inputmode="decimal" autocomplete="off"');
  }else if(item.id==='rate'){
    const rateWhen=D.rate&&D.rate.asOf?' The starting rate is the 30-year fixed survey for the week of '+D.rate.asOf+'.':'';
    body=field('rate','Interest rate, percent per year',state.rate,'You can type a different rate.'+rateWhen,'inputmode="decimal" autocomplete="off"');
  }else if(item.id==='place'){
    const options=['<option value="">Choose a county or city</option>'].concat(D.places.map(p=>'<option value="'+esc(p.id)+'"'+(p.id===state.placeId?' selected':'')+'>'+esc(p.name)+'</option>'));
    body='<div class="field"><label for="place">County or city</label><select id="place">'+options.join('')+'</select><p class="hint" id="placeHint">Venice and North Port are in Sarasota County. This choice fills property tax from the published county figure.</p></div>';
  }else if(item.id==='tax'){
    const here=place();
    const mill=here&&here.millage;
    let taxNote='Enter the yearly property tax. The taxable value used here is the home price. ';
    if(mill&&mill.value!=null&&(mill.low==null||mill.high==null))taxNote+='A separate city total was not available, so this starts from the county average. ';
    else if(mill&&mill.low!=null&&mill.high!=null)taxNote+='The box starts from the county average. The range uses the published low and high millage until you change this box. ';
    body=field('tax','Property tax, dollars per year',state.taxAnnual,taxNote,'inputmode="decimal" autocomplete="off"');
  }else if(item.id==='insurance'){
    const county=Mortgage.countyInsurance(D,place());
    const insNote='Estimate based on Florida insurance averages; your quote will vary.'+(county?' The box starts at the '+place().county+' average.':'');
    body=field('insurance','Homeowners insurance, dollars per month',state.insuranceMonthly,insNote,'inputmode="decimal" autocomplete="off"');
  }else if(item.id==='hoa'){
    const options=['<option value="">No community selected</option>'].concat((D.communities||[]).map(function(c){
      const tag=c.label==='MEASURED'?'published range':'enter your own';
      return '<option value="'+esc(c.id)+'"'+(c.id===state.communityId?' selected':'')+'>'+esc(c.name)+' ('+tag+')</option>';
    }));
    const chosen=Mortgage.communityById(D,state.communityId);
    const hoaHint=chosen&&chosen.label==='MEASURED'?'A published range for this community is included until you type your own monthly amount.':chosen?'Enter the monthly HOA from your paperwork. A published amount for this community is not included.':'Optional. Leave this blank to leave HOA out.';
    body='<div class="field"><label for="community">Community</label><select id="community">'+options.join('')+'</select></div>'+field('hoa','HOA dues, dollars per month',state.hoaMonthly,hoaHint,'inputmode="decimal" autocomplete="off"');
  }else{
    const result=Mortgage.buildEstimate({
      price:state.price,downDollars:state.downDollars,downPercent:state.downPercent,
      rate:state.rate,rateTouched:!!state.touched.rate,placeId:state.placeId,
      taxAnnual:state.taxAnnual,taxTouched:!!state.touched.tax,
      insuranceMonthly:state.insuranceMonthly,insuranceTouched:!!state.touched.insurance,
      hoaMonthly:state.hoaMonthly,hoaTouched:!!state.touched.hoa,communityId:state.communityId
    },D);
    const rows=result.lines.map(line=>{
      const cells=line.range?'<td class="n">'+money(line.range.low)+'</td><td class="n">'+money(line.range.high)+'</td>':'<td colspan="2">'+(line.omitted?'Not included':'—')+'</td>';
      return '<tr><th scope="row">'+esc(line.label)+'</th>'+cells+'</tr>';
    }).join('');
    const figures=result.total?'<div class="figures" aria-label="Low and high monthly payment"><div><small>Low</small><strong>'+money(result.total.low)+'</strong></div><div><small>High</small><strong>'+money(result.total.high)+'</strong></div></div>':'<p>Enter a home price, a down payment, an interest rate, property tax, and insurance to see the full range.'+(result.missing.length?' Still needed: '+esc(result.missing.join(', '))+'.':'')+'</p>';
    const detailHtml=(result.details||[]).length?'<details class="fold"><summary>Details</summary>'+result.details.map(function(line){return '<p>'+esc(line)+'</p>'}).join('')+'</details>':'';
    const sourceHtml='<details class="fold"><summary>Sources</summary><ul>'+sourceList()+'</ul></details>';
    body=figures+'<div class="tableWrap" tabindex="0" role="region" aria-label="Monthly payment breakdown"><table><caption class="sr">Low and high for each part of the monthly payment</caption><thead><tr><th scope="col">Item</th><th scope="col">Low</th><th scope="col">High</th></tr></thead><tbody>'+rows+'</tbody></table></div><p>'+result.notes.map(esc).join(' ')+'</p>'+detailHtml+sourceHtml+'<p><a class="primary" href="'+BOOK_URL+'" target="_blank" rel="noopener noreferrer">Book a Call with Guy</a></p>';
    const doneSig=result.complete?JSON.stringify([state.price,state.downDollars,state.downPercent,state.rate,state.placeId,state.communityId,state.taxAnnual,state.insuranceMonthly,state.hoaMonthly]):'';
    if(doneSig && doneSig!==state.doneSig){state.doneSig=doneSig;track('mortgage_complete',{place:state.placeId||'none'})}
  }
  const backButton=step===0&&item.id!=='results'?'':'<button type="button" class="secondary" id="backBtn">Back</button>';
  const actions=item.id==='results'
    ?'<div class="actions">'+backButton+'</div>'
    :'<div class="actions">'+backButton+'<button type="button" class="primary" id="nextBtn">'+nextLabel+'</button></div>';
  card.innerHTML='<h2 id="question">'+esc(item.title)+'</h2>'+body+actions+'<p class="status" id="status" role="alert">'+esc(error)+'</p>';
  error='';
  const heading=document.getElementById('question');
  heading.tabIndex=-1;
  heading.focus({focusVisible:false});
  live.textContent='Question '+(step+1)+' of '+STEPS.length+'. '+item.title;
  const back=document.getElementById('backBtn');
  const next=document.getElementById('nextBtn');
  if(back)back.onclick=function(){readInputs();error='';show(step-1)};
  if(next)next.onclick=function(){
    readInputs();
    const capped=gentleClamp();
    const problem=currentInvalid();
    if(capped||problem){error=capped||problem;show(step);return}
    show(step+1);
  };
  ['price','downDollars','downPercent','rate','tax','insurance','hoa'].forEach(function(id){
    const el=document.getElementById(id);
    if(el)snapshot[id]=el.value;
  });
  card.querySelectorAll('input').forEach(input=>{
    input.addEventListener('keydown',function(event){if(event.key==='Enter'){event.preventDefault();if(next)next.click()}});
  });
}
function loadFred(){
  const key=D.fred&&D.fred.apiKey;
  if(!key)return;
  const url='https://api.stlouisfed.org/fred/series/observations?series_id='+encodeURIComponent(D.fred.seriesId||'MORTGAGE30US')+'&api_key='+encodeURIComponent(key)+'&file_type=json&sort_order=desc&limit=1';
  fetch(url).then(function(res){if(!res.ok)throw new Error('fred');return res.json()}).then(function(data){
    const obs=data.observations&&data.observations[0];
    const value=obs&&Mortgage.num(obs.value);
    if(value==null)return;
    state.rateMeta={source:'FRED series '+(D.fred.seriesId||'MORTGAGE30US'),url:D.fred.url,asOf:obs.date,fromFred:true};
    if(state.touched.rate)return;
    state.rate=String(value);
    if(STEPS[step].id==='rate'||STEPS[step].id==='results')show(step);
  }).catch(function(){
    state.rateMeta.source=state.rateMeta.source||null;
  });
}
document.addEventListener('click',function(event){
  const link=event.target.closest&&event.target.closest('a[href="'+BOOK_URL+'"]');
  if(link)track('book_call',{link_url:BOOK_URL,link_text:(link.textContent||'').trim()});
});
prefill();
show(0);
loadFred();
</script>
</body>
